name: NCMM Runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release assets after a verified Real Installation Matrix pass'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'runtime/**'
      - 'README.txt'
      - 'mods/**'
      - 'components/**'
      - 'sdk/**'
      - 'ci/Build-Runtime.ps1'
      - 'ci/Get-NcmmCurrentVersion.ps1'
      - 'ci/Test-TextEncoding.ps1'
      - 'ci/Test-VersionConsistency.ps1'
      - 'ci/Test-BootstrapFailureHarness.ps1'
      - 'ci/Test-ComponentCatalog.ps1'
      - 'ci/NativeModuleCatalog.ps1'
      - 'ci/Test-NativeModuleCatalog.ps1'
      - 'ci/Test-HostPatchDomains.ps1'
      - 'ci/HostPatchDomains.ps1'
      - 'ci/host-patch-domains.json'
      - 'ci/Test-NCMMNativeScaffold.ps1'
      - 'ci/Test-NCMMModuleRegistrationPreview.ps1'
      - 'tools/New-NCMMModuleRegistrationPreview.ps1'
      - 'tools/New-NCMMNativeModule.ps1'
      - 'ci/Test-NativeReleaseLayout.ps1'
      - 'components/native-build.json'
      - 'ci/Test-InstallerTransaction.ps1'
      - 'ci/Test-InstallationMatrix.ps1'
      - 'ci/Test-HostPayloadContracts.ps1'
      - 'ci/Test-SurvivorPayloadContracts.ps1'
      - 'ci/Test-Infrastructure083.ps1'
      - 'ci/Regenerate-PackageIntegrity.ps1'
      - 'compat/package-files.txt'
      - 'compat/package.integrity.json'
      - 'compat/compatibility.manifest.json'
      - 'internal/stages/**'
      - 'tools/NCMM.Infrastructure.Common.ps1'
      - 'tools/NCMM.Infrastructure.Core.ps1'
      - 'tools/NCMM.Infrastructure.Package.ps1'
      - 'tools/NCMM.Infrastructure.Transaction.ps1'
      - 'tools/NCMM.Update.Common.ps1'
      - 'tests/**'
      - 'ci/test_survivor_graph.py'
      - 'feed/index.json'
      - 'host_patch/**'
      - '.editorconfig'
      - '.github/workflows/ncmm-runtime.yml'

  pull_request:
    paths:
      - 'runtime/**'
      - 'README.txt'
      - 'mods/**'
      - 'components/**'
      - 'sdk/**'
      - 'ci/Build-Runtime.ps1'
      - 'ci/Get-NcmmCurrentVersion.ps1'
      - 'ci/Test-TextEncoding.ps1'
      - 'ci/Test-VersionConsistency.ps1'
      - 'ci/Test-BootstrapFailureHarness.ps1'
      - 'ci/Test-ComponentCatalog.ps1'
      - 'ci/NativeModuleCatalog.ps1'
      - 'ci/Test-NativeModuleCatalog.ps1'
      - 'ci/Test-HostPatchDomains.ps1'
      - 'ci/HostPatchDomains.ps1'
      - 'ci/host-patch-domains.json'
      - 'ci/Test-NCMMNativeScaffold.ps1'
      - 'ci/Test-NCMMModuleRegistrationPreview.ps1'
      - 'tools/New-NCMMModuleRegistrationPreview.ps1'
      - 'tools/New-NCMMNativeModule.ps1'
      - 'ci/Test-NativeReleaseLayout.ps1'
      - 'components/native-build.json'
      - 'ci/Test-InstallerTransaction.ps1'
      - 'ci/Test-InstallationMatrix.ps1'
      - 'ci/Test-HostPayloadContracts.ps1'
      - 'ci/Test-SurvivorPayloadContracts.ps1'
      - 'ci/Test-Infrastructure083.ps1'
      - 'ci/Regenerate-PackageIntegrity.ps1'
      - 'compat/package-files.txt'
      - 'compat/package.integrity.json'
      - 'compat/compatibility.manifest.json'
      - 'internal/stages/**'
      - 'tools/NCMM.Infrastructure.Common.ps1'
      - 'tools/NCMM.Infrastructure.Core.ps1'
      - 'tools/NCMM.Infrastructure.Package.ps1'
      - 'tools/NCMM.Infrastructure.Transaction.ps1'
      - 'tools/NCMM.Update.Common.ps1'
      - 'tests/**'
      - 'ci/test_survivor_graph.py'
      - 'feed/index.json'
      - 'host_patch/**'
      - '.editorconfig'
      - '.github/workflows/ncmm-runtime.yml'
permissions:
  id-token: write
  attestations: write
  contents: write

concurrency:
  group: ncmm-runtime-release-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-runtime:
    runs-on: windows-2022
    steps:
      - name: Checkout NCMM repository
        uses: actions/checkout@v4

      - name: Validate repository text encoding
        shell: powershell
        run: |
          ./ci/Test-TextEncoding.ps1 -RepoRoot "$env:GITHUB_WORKSPACE" -SelfTest

      - name: Validate current runtime package consistency
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expectedVersion = (./ci/Get-NcmmCurrentVersion.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE").Trim()
          $bootstrap = Get-Content runtime/NCMMBootstrap.cs -Raw
          $setupCore = Get-Content runtime/NCMMSetupCore.cs -Raw
          $setup = Get-Content runtime/NCMMSetup.cs -Raw
          $hostSource = Get-Content host_patch/ncmm_loader.cpp -Raw

          $bootstrapVersionMarker = 'private const string RuntimeVersion = "' + $expectedVersion + '";'
          $setupCoreVersionMarker = 'internal const string RuntimeVersion = "' + $expectedVersion + '";'
          $setupTitleMarker = 'Text = "NCMM " + SetupCore.RuntimeVersion + " Setup";'
          $hostVersionMarker = 'return "' + $expectedVersion + '";'

          if (-not $bootstrap.Contains($bootstrapVersionMarker)) {
            throw "Bootstrap runtime version is not $expectedVersion."
          }
          if (-not $bootstrap.Contains('"NCMM/" + RuntimeVersion')) {
            throw 'Bootstrap User-Agent must derive from RuntimeVersion.'
          }
          if (-not $setupCore.Contains($setupCoreVersionMarker)) {
            throw "Setup runtime version is not $expectedVersion."
          }
          if (-not $setup.Contains($setupTitleMarker)) {
            throw 'Setup title must derive from SetupCore.RuntimeVersion.'
          }
          if (-not $hostSource.Contains($hostVersionMarker)) {
            throw "Host source version is not $expectedVersion."
          }
          "value=$expectedVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Current runtime package consistency: PASS (runtime/host $expectedVersion)." -ForegroundColor Green

      - name: Validate component dependency and installer contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./ci/Test-Infrastructure083.ps1 -PackageRoot "$env:GITHUB_WORKSPACE"

      - name: Verify Survivor source prerequisite DAG
        shell: pwsh
        run: python ci/test_survivor_graph.py

      - name: Check native module build registry
        shell: powershell
        run: .\ci\Test-NativeModuleCatalog.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Verify Host patch domain graph
        shell: powershell
        run: .\ci\Test-HostPatchDomains.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Validate SDK registration preview isolation
        shell: powershell
        run: .\ci\Test-NCMMModuleRegistrationPreview.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build runtime + bundled code-mods
        shell: powershell
        run: |
          ./ci/Build-Runtime.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -OutputRoot "$env:GITHUB_WORKSPACE/dist/runtime" `
            -SkipTextEncoding

      - name: Verify native release ZIP layouts
        shell: powershell
        run: .\ci\Test-NativeReleaseLayout.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE" -DistRoot "$env:GITHUB_WORKSPACE/dist"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCMM_Runtime_v${{ steps.version.outputs.value }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Check certified-host feed readiness
        id: host_feed
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $feed = Get-Content feed/index.json -Raw | ConvertFrom-Json
          $hostVersion = (./ci/Get-NcmmCurrentVersion.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE").Trim()
          $currentRevision = (./ci/Get-PatchRevision.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE").Trim()
          if ($currentRevision -notmatch '^[0-9a-f]{64}$') {
            throw "Current patch revision is invalid: $currentRevision"
          }

          $versionReady = [string]$feed.runtime_version -eq $hostVersion
          $revisionReady = [string]$feed.patch_revision -eq $currentRevision

          $seedTags = @(
            Get-Content ci/seed-hosts.txt |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
          )
          $hostEntries = @(
            $feed.hosts.PSObject.Properties |
              ForEach-Object { $_.Value } |
              Where-Object {
                [string]$_.ncmm_version -eq $hostVersion -and
                [string]$_.patch_revision -eq $currentRevision
              }
          )
          $missingSeeds = @(
            $seedTags | Where-Object {
              $seed = $_
              -not ($hostEntries | Where-Object { [string]$_.upstream_tag -eq $seed })
            }
          )
          $seedReady = $missingSeeds.Count -eq 0
          $ready = $versionReady -and $revisionReady -and $seedReady
          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($ready) {
            Write-Host "Certified-host feed is ready for NCMM $hostVersion / patch $currentRevision and all required seed hosts." -ForegroundColor Green
          } else {
            Write-Host (
              "Certified-host feed is not release-ready. " +
              "feed_version=" + [string]$feed.runtime_version +
              " source_version=" + $hostVersion +
              " feed_patch=" + [string]$feed.patch_revision +
              " source_patch=" + $currentRevision +
              " missing_seeds=" + ($missingSeeds -join ',')
            ) -ForegroundColor Yellow
          }

      - name: Verify exact-source real installation qualification
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/Test-ReleaseQualification.ps1 -Repository '${{ github.repository }}' -SourceSha '${{ github.sha }}'

      - name: Attest built artifact provenance
        if: github.ref == 'refs/heads/main' && steps.host_feed.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.zip

      - name: Publish runtime release
        if: github.ref == 'refs/heads/main' && steps.host_feed.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (./ci/Get-NcmmCurrentVersion.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE").Trim()
          $tag = "ncmm-runtime-v$version-build-$($env:GITHUB_SHA.Substring(0,12))"
          cmd /c "gh release view $tag >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "NCMM Runtime v$version" --notes 'Portable NCMM runtime with certified-host and crash-loop hardening. No compiler or build tools are required on player PCs.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create runtime release.' }
          }
          . .\ci\NativeModuleCatalog.ps1
          $modules = @(Get-NcmmNativeBuildModules -RepositoryRoot "$env:GITHUB_WORKSPACE")
          $assets = @("dist/NCMM_Full_v$version.zip", "dist/NCMM_Runtime_v$version.zip")
          foreach ($module in $modules) {
            $assets += "dist/NCMM_$($module.ArchiveStem)_v$($module.Version).zip"
          }
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) { throw "Native release asset missing: $asset" }
          }
          gh release edit $tag --title "NCMM v$version Runtime + Full Bundle" --notes "Recommended: NCMM_Full_v$version.zip. Includes runtime and independently installable native module packages."
          if ($LASTEXITCODE -ne 0) { throw 'Could not update runtime release metadata.' }
          ./ci/Publish-ImmutableAsset.ps1 -Tag $tag -Asset $assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload full/runtime/module packages.' }

      - name: Publish Advanced World Settings release
        if: github.ref == 'refs/heads/main' && steps.host_feed.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [string](Get-Content 'mods/AdvancedWorldSettings/mod.json' -Raw | ConvertFrom-Json).version
          $hostVersion = (./ci/Get-NcmmCurrentVersion.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE").Trim()
          $tag = "ncmm-aws-v$version-build-$($env:GITHUB_SHA.Substring(0,12))"
          cmd /c "gh release view $tag >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Advanced World Settings v$version" --notes "Independent NCMM native module. Requires NCMM Host $hostVersion. Recommended installation: NCMM_Setup.exe component selection."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create AWS module release.' }
          }
          gh release edit $tag --title "Advanced World Settings v$version" --notes "Independent NCMM native module. Requires NCMM Host $hostVersion. Recommended installation: NCMM_Setup.exe component selection."
          if ($LASTEXITCODE -ne 0) { throw 'Could not update AWS module release metadata.' }
          ./ci/Publish-ImmutableAsset.ps1 -Tag $tag -Asset "dist/NCMM_AdvancedWorldSettings_v$version.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload AWS module package.' }

      - name: Publish Survivor Progression release
        if: github.ref == 'refs/heads/main' && steps.host_feed.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [string](Get-Content 'mods/SurvivorProgression/mod.json' -Raw | ConvertFrom-Json).version
          $hostVersion = (./ci/Get-NcmmCurrentVersion.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE").Trim()
          $tag = "ncmm-survivor-v$version-build-$($env:GITHUB_SHA.Substring(0,12))"
          cmd /c "gh release view $tag >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Survivor Progression v$version" --notes "Independent NCMM native module. Requires NCMM Host $hostVersion. Recommended installation: NCMM_Setup.exe component selection."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Survivor module release.' }
          }
          gh release edit $tag --title "Survivor Progression v$version" --notes "Independent NCMM native module. Requires NCMM Host $hostVersion. Recommended installation: NCMM_Setup.exe component selection."
          if ($LASTEXITCODE -ne 0) { throw 'Could not update Survivor module release metadata.' }
          ./ci/Publish-ImmutableAsset.ps1 -Tag $tag -Asset "dist/NCMM_SurvivorProgression_v$version.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Survivor module package.' }
