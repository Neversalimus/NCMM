name: NCMM Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime/**'
      - 'mods/**'
      - 'components/**'
      - 'sdk/**'
      - 'ci/Build-Runtime.ps1'
      - 'ci/Test-TextEncoding.ps1'
      - 'ci/Test-VersionConsistency.ps1'
      - 'ci/Test-BootstrapFailureHarness.ps1'
      - 'tests/**'
      - 'feed/index.json'
      - 'host_patch/ncmm_fault_policy.h'
      - 'host_patch/ncmm_manifest_policy.h'
      - '.editorconfig'
      - '.github/workflows/ncmm-runtime.yml'

permissions:
  contents: write

concurrency:
  group: ncmm-runtime-release
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: windows-2022
    steps:
      - name: Checkout NCMM repository
        uses: actions/checkout@v4

      - name: Validate repository text encoding
        shell: powershell
        run: |
          ./ci/Test-TextEncoding.ps1 -RepoRoot "$env:GITHUB_WORKSPACE" -SelfTest

      - name: Validate current runtime package consistency
        shell: powershell
        run: |
          $bootstrap = Get-Content runtime/NCMMBootstrap.cs -Raw
          $setup = Get-Content runtime/NCMMSetup.cs -Raw
          $hostSource = Get-Content host_patch/ncmm_loader.cpp -Raw
          $components = Get-Content components/index.json -Raw | ConvertFrom-Json
          if (-not $bootstrap.Contains('private const string RuntimeVersion = "0.8.0";')) { throw 'Bootstrap runtime version is not 0.8.0.' }
          if (-not $bootstrap.Contains('NCMM/0.8.0')) { throw 'Bootstrap User-Agent is not 0.8.0.' }
          if (-not $setup.Contains('NCMM 0.8.0 Setup')) { throw 'Setup version is not 0.8.0.' }
          if (-not $hostSource.Contains('return "0.8.0";')) { throw 'Host version is not 0.8.0.' }
          $hostComponent = @($components.components | Where-Object { $_.id -eq 'ncmm_host' })[0]
          if ($null -eq $hostComponent -or [string]$hostComponent.version -ne '0.8.0') { throw 'Component catalog host version is not 0.8.0.' }
          Write-Host 'Current runtime package consistency: PASS (runtime/host 0.8.0).' -ForegroundColor Green

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build runtime + bundled code-mods
        shell: powershell
        run: |
          ./ci/Build-Runtime.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -OutputRoot "$env:GITHUB_WORKSPACE/dist/runtime"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCMM_Runtime_v0.8.0
          path: dist/*.zip
          if-no-files-found: error

      - name: Check certified-host feed readiness
        id: host_feed
        shell: powershell
        run: |
          $feed = Get-Content feed/index.json -Raw | ConvertFrom-Json
          $ready = [string]$feed.runtime_version -eq '0.8.0'
          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($ready) {
            Write-Host 'Certified-host feed is ready for runtime 0.8.0.' -ForegroundColor Green
          } else {
            Write-Host ("Certified-host feed is still " + [string]$feed.runtime_version + "; runtime 0.8.0 release publication is intentionally skipped.") -ForegroundColor Yellow
          }

      - name: Publish runtime release
        if: github.ref == 'refs/heads/main' && steps.host_feed.outputs.ready == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'ncmm-runtime-v0.8.0'
          cmd /c "gh release view $tag >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'NCMM Runtime v0.8.0' --notes 'Portable NCMM runtime with certified-host and crash-loop hardening. No compiler or build tools are required on player PCs.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create runtime release.' }
          }
          gh release upload $tag 'dist/NCMM_Runtime_v0.8.0.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload runtime package.' }

      - name: Publish Advanced World Settings release
        if: github.ref == 'refs/heads/main' && steps.host_feed.outputs.ready == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'ncmm-aws-v0.6.2'
          cmd /c "gh release view $tag >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'Advanced World Settings v0.6.2' --notes 'Independent NCMM native module. Requires NCMM Host 0.8.0. Recommended installation: NCMM_Setup.exe component selection.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create AWS module release.' }
          }
          gh release upload $tag 'dist/NCMM_AdvancedWorldSettings_v0.6.2.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload AWS module package.' }

      - name: Publish Survivor Progression release
        if: github.ref == 'refs/heads/main' && steps.host_feed.outputs.ready == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'ncmm-survivor-v0.11.3'
          cmd /c "gh release view $tag >nul 2>nul"
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'Survivor Progression v0.11.3' --notes 'Independent NCMM native module. Requires NCMM Host 0.8.0. Recommended installation: NCMM_Setup.exe component selection.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Survivor module release.' }
          }
          gh release upload $tag 'dist/NCMM_SurvivorProgression_v0.11.3.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Survivor module package.' }
