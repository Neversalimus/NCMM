name: NCMM Real Installation Matrix

on:
  push:
    branches:
      - main
    paths:
      - 'feed/index.json'
      - '.github/workflows/ncmm-installation-matrix.yml'
  workflow_dispatch:
    # Certified Hosts dispatches this explicitly after publishing a ready seed feed.
    inputs:
      upstream_tag:
        description: 'Official CDDA release tag; blank uses first seed host'
        required: false
        type: string
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

concurrency:
  group: ncmm-real-installation-matrix
  cancel-in-progress: true

jobs:
  real-install-smoke:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout NCMM repository
        uses: actions/checkout@v4

      - name: Validate repository text encoding
        shell: powershell
        run: ./ci/Test-TextEncoding.ps1 -RepoRoot "$env:GITHUB_WORKSPACE"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build current runtime and modules
        shell: powershell
        run: |
          ./ci/Build-Runtime.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -OutputRoot "$env:GITHUB_WORKSPACE/dist/runtime" `
            -SkipTextEncoding `
            -PayloadOnly

      - name: Resolve official CDDA Windows asset
        id: release
        shell: powershell
        run: |
          $tag = '${{ inputs.upstream_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = @(Get-Content ci/seed-hosts.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ })[0]
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'No CDDA release tag available for real install smoke.' }
          $release = (& gh api "repos/CleverRaven/Cataclysm-DDA/releases/tags/$tag") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve official CDDA release $tag." }
          $asset = @($release.assets | Where-Object {
            $_.name -like 'cdda-windows-with-graphics-x64-*.zip'
          } | Sort-Object name | Select-Object -First 1)
          if (-not $asset) {
            $asset = @($release.assets | Where-Object {
              $_.name -like 'cdda-windows-with-graphics-and-sounds-x64-*.zip'
            } | Sort-Object name | Select-Object -First 1)
          }
          if (-not $asset) { throw "No official Windows graphics asset found for $tag." }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset=$([string]$asset.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_id=$([string]$asset.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_digest=$([string]$asset.digest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Real install target: $tag / $([string]$asset.name)"

      - name: Restore official CDDA archive cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ncmm-real-cdda
          key: ncmm-real-cdda-v1-${{ runner.os }}-${{ steps.release.outputs.tag }}-${{ steps.release.outputs.asset_id }}

      - name: Download and extract official CDDA
        id: game
        shell: powershell
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $asset = '${{ steps.release.outputs.asset }}'
          $expectedDigest = '${{ steps.release.outputs.asset_digest }}'
          $download = Join-Path $env:RUNNER_TEMP 'ncmm-real-cdda'
          $extract = Join-Path $env:RUNNER_TEMP 'ncmm-real-cdda-extracted'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          $zipPath = Join-Path $download $asset
          if (-not (Test-Path $zipPath -PathType Leaf)) {
            & gh release download $tag -R CleverRaven/Cataclysm-DDA -p $asset -D $download --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not download $tag / $asset" }
          } else {
            Write-Host "Official CDDA archive cache: HIT ($asset)"
          }
          if (-not (Test-Path $zipPath -PathType Leaf)) { throw 'Downloaded CDDA archive is missing.' }

          if (-not [string]::IsNullOrWhiteSpace($expectedDigest)) {
            if (-not $expectedDigest.StartsWith('sha256:') -or $expectedDigest.Length -ne 71) {
              throw "Unexpected official CDDA asset digest format: $expectedDigest"
            }
            $actualDigest = 'sha256:' + (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualDigest -ne $expectedDigest.ToLowerInvariant()) {
              throw "Official CDDA archive digest mismatch: $actualDigest != $expectedDigest"
            }
            Write-Host "Official CDDA archive digest: VERIFIED"
          }

          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $tar = Get-Command tar.exe -ErrorAction SilentlyContinue
          if ($tar) {
            & $tar.Source -xf $zipPath -C $extract
            if ($LASTEXITCODE -ne 0) { throw "tar.exe could not extract $asset" }
          } else {
            Expand-Archive -LiteralPath $zipPath -DestinationPath $extract -Force
          }
          $exe = @(Get-ChildItem $extract -Filter 'cataclysm-tiles.exe' -File -Recurse)
          if ($exe.Count -ne 1) { throw "Expected exactly one cataclysm-tiles.exe, found $($exe.Count)." }
          $root = $exe[0].Directory.FullName
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Official CDDA extracted to: $root"

      - name: Run production SetupCore on official CDDA
        shell: powershell
        run: |
          ./ci/Test-InstallationMatrix.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -PayloadRoot "$env:GITHUB_WORKSPACE/dist/runtime/payload" `
            -Mode Real `
            -GameRoot '${{ steps.game.outputs.root }}'

      - name: Check certified Host feed readiness
        id: host_ready
        shell: powershell
        run: |
          $root = '${{ steps.game.outputs.root }}'
          $vanilla = Join-Path $root 'cataclysm-tiles.vanilla.exe'
          if (-not (Test-Path $vanilla -PathType Leaf)) {
            throw "Installed vanilla backup is missing: $vanilla"
          }

          $vanillaSha = (Get-FileHash $vanilla -Algorithm SHA256).Hash.ToLowerInvariant()
          $feed = Get-Content feed/index.json -Raw | ConvertFrom-Json
          $entryProperty = @($feed.hosts.PSObject.Properties | Where-Object { $_.Name -eq $vanillaSha } | Select-Object -First 1)
          $ready = $entryProperty.Count -eq 1
          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($ready) {
            Write-Host "Certified Host feed entry is ready for vanilla SHA $vanillaSha." -ForegroundColor Green
            exit 0
          }

          $eventName = '${{ github.event_name }}'
          $changed = @()
          if ($eventName -eq 'push') {
            $changed = @(
              gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA" --jq '.files[].filename'
            )
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve changed files for $env:GITHUB_SHA."
            }
            $changed = @($changed | Where-Object { $_ } | Select-Object -Unique)
            Write-Host ("Push files: " + ($changed -join ', '))
          }
          $workflowOnlySelfTest = $eventName -eq 'push' -and
                                  ($changed -contains '.github/workflows/ncmm-installation-matrix.yml') -and
                                  -not ($changed -contains 'feed/index.json')
          if ($workflowOnlySelfTest) {
            Write-Host "Certified Host is not ready yet; workflow self-test stops after real SetupCore install." -ForegroundColor Yellow
            exit 0
          }

          throw "Certified Host feed is not ready for vanilla SHA $vanillaSha."

      - name: Launch certified Host twice through installed bootstrap
        if: steps.host_ready.outputs.ready == 'true'
        shell: powershell
        timeout-minutes: 8
        run: |
          $root = '${{ steps.game.outputs.root }}'
          $exe = Join-Path $root 'cataclysm-tiles.exe'
          $ncmm = Join-Path $root 'ncmm'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Installed NCMM bootstrap is missing: $exe" }

          $firstSmoke = Start-Process -FilePath $exe -ArgumentList @('--ncmm-runtime-smoke','--ncmm-refresh') -Wait -PassThru
          if ($firstSmoke.ExitCode -ne 0) {
            throw "First real NCMM runtime smoke failed with exit $($firstSmoke.ExitCode)."
          }
          if (Test-Path (Join-Path $ncmm 'boot.pending')) {
            throw 'First real runtime smoke left boot.pending.'
          }
          if (-not (Test-Path (Join-Path $ncmm 'boot.ready'))) {
            throw 'First real runtime smoke did not publish boot.ready.'
          }
          if (Test-Path (Join-Path $ncmm 'ncmm.auto_disabled')) {
            throw 'First real runtime smoke unexpectedly auto-disabled NCMM.'
          }

          $secondSmoke = Start-Process -FilePath $exe -ArgumentList @('--ncmm-runtime-smoke','--ncmm-offline') -Wait -PassThru
          if ($secondSmoke.ExitCode -ne 0) {
            throw "Second real NCMM runtime smoke failed with exit $($secondSmoke.ExitCode)."
          }
          if (Test-Path (Join-Path $ncmm 'boot.pending')) {
            throw 'Second real runtime smoke left boot.pending.'
          }
          if (-not (Test-Path (Join-Path $ncmm 'boot.ready'))) {
            throw 'Second real runtime smoke did not publish boot.ready.'
          }
          if (Test-Path (Join-Path $ncmm 'ncmm.auto_disabled')) {
            throw 'Second real runtime smoke was misclassified as a crash.'
          }

      - name: Run real AWS worldgen + Survivor gameplay smoke
        if: steps.host_ready.outputs.ready == 'true'
        shell: powershell
        timeout-minutes: 12
        run: |
          $root = '${{ steps.game.outputs.root }}'
          $exe = Join-Path $root 'cataclysm-tiles.exe'
          $ncmm = Join-Path $root 'ncmm'
          $gameplaySmoke = Start-Process -FilePath $exe -ArgumentList @('--ncmm-gameplay-smoke','--ncmm-offline') -Wait -PassThru
          if ($gameplaySmoke.ExitCode -ne 0) {
            throw "Real NCMM gameplay smoke failed with exit $($gameplaySmoke.ExitCode)."
          }
          $resultPath = Join-Path $ncmm 'gameplay-smoke.json'
          if (-not (Test-Path $resultPath -PathType Leaf)) {
            throw 'Gameplay smoke did not publish gameplay-smoke.json.'
          }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not [bool]$result.success) {
            throw ("Gameplay smoke reported failure: " + [string]$result.reason)
          }
          if ([int]$result.aws_settings -ne 48 -or [int]$result.aws_hooks -ne 48) {
            throw ("AWS gameplay coverage mismatch: settings=" + $result.aws_settings + " hooks=" + $result.aws_hooks)
          }
          if ([int]$result.survivor_perks -ne 369) {
            throw ("Survivor gameplay coverage mismatch: " + $result.survivor_perks)
          }
          if (Test-Path (Join-Path $ncmm 'boot.pending')) {
            throw 'Gameplay smoke left boot.pending.'
          }

          $worldRoot = Join-Path $root 'save\NCMM Gameplay Smoke'
          if (-not (Test-Path $worldRoot -PathType Container)) {
            throw "AWS gameplay smoke did not create the expected world directory: $worldRoot"
          }
          $worldOptions = Join-Path $worldRoot 'worldoptions.json'
          if (-not (Test-Path $worldOptions -PathType Leaf)) {
            throw "AWS gameplay smoke did not persist worldoptions.json: $worldOptions"
          }
          $worldOptionsText = Get-Content $worldOptions -Raw
          foreach ($settingId in @(
            'NCMM_AWS_CUSTOM_GEOGRAPHY',
            'NCMM_AWS_CITY_SIZE',
            'NCMM_AWS_FOREST_THRESHOLD',
            'NCMM_AWS_ENABLE_RIVERS',
            'NCMM_AWS_LAKE_MIN_SIZE',
            'NCMM_AWS_ENABLE_HIGHWAYS',
            'NCMM_AWS_RAVINE_DEPTH'
          )) {
            if (-not $worldOptionsText.Contains($settingId)) {
              throw "Persisted AWS world options are missing $settingId."
            }
          }
          $generatedWorldFiles = @(Get-ChildItem $worldRoot -File -Recurse -ErrorAction Stop)
          if ($generatedWorldFiles.Count -lt 2) {
            throw "AWS gameplay smoke world has too little persisted/generated content: $($generatedWorldFiles.Count) files."
          }
          Write-Host ("Gameplay smoke PASS: AWS 48/48 + persisted world, Survivor " + $result.survivor_perks + "/369") -ForegroundColor Green

      - name: Verify certified Host + modules and restore vanilla
        if: steps.host_ready.outputs.ready == 'true'
        shell: powershell
        run: |
          ./ci/Test-InstallationMatrix.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -PayloadRoot "$env:GITHUB_WORKSPACE/dist/runtime/payload" `
            -Mode Real `
            -RealPhase PostRuntime `
            -GameRoot '${{ steps.game.outputs.root }}'

      - name: Publish real-install evidence
        if: always()
        shell: powershell
        run: |
          $root = '${{ steps.game.outputs.root }}'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'dist/real-install-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          foreach ($name in @('VERSION.txt','cataclysm-tiles.exe','cataclysm-tiles.vanilla.exe')) {
            $path = Join-Path $root $name
            if (Test-Path $path -PathType Leaf) {
              if ($name -like '*.exe') {
                $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
                Set-Content (Join-Path $evidence ($name + '.sha256.txt')) -Value $hash -Encoding Ascii
              } else { Copy-Item $path (Join-Path $evidence $name) -Force }
            }
          }
          foreach ($name in @(
            'installed-components.json','bootstrap.sha256','vanilla.sha256',
            'runtime.state.json','modules.state.json','host.binding.json',
            'gameplay-smoke.json','bootstrap.log','ncmm.log','boot.ready'
          )) {
            $path = Join-Path $root ('ncmm\' + $name)
            if (Test-Path $path -PathType Leaf) { Copy-Item $path (Join-Path $evidence $name) -Force }
          }
          $worldRoot = Join-Path $root 'save\NCMM Gameplay Smoke'
          $worldOptions = Join-Path $worldRoot 'worldoptions.json'
          if (Test-Path $worldOptions -PathType Leaf) {
            Copy-Item $worldOptions (Join-Path $evidence 'aws-gameplay-worldoptions.json') -Force
          }
          if (Test-Path $worldRoot -PathType Container) {
            $manifest = Get-ChildItem $worldRoot -File -Recurse | ForEach-Object {
              [PSCustomObject]@{
                path = $_.FullName.Substring($worldRoot.Length).TrimStart('\')
                bytes = $_.Length
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
            $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $evidence 'aws-gameplay-world-files.json') -Encoding UTF8
          }
          "## NCMM real runtime smoke" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- CDDA: ${{ steps.release.outputs.tag }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- production SetupCore: install / module switch / reinstall" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ('${{ steps.host_ready.outputs.ready }}' -eq 'true') {
            "- bootstrap -> certified Host -> AWS + Survivor -> boot.ready -> clean exit: two consecutive real launches" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- gameplay smoke: real AWS randomized world save/reload/overmap + persisted world evidence + Survivor 369-perk aggregate/consumer effects" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "- RestoreVanilla: verified by SHA-256" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "- certified Host/gameplay stage: deferred until feed contains this vanilla SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncmm-real-install-${{ steps.release.outputs.tag }}
          path: dist/real-install-evidence/**
          if-no-files-found: warn
