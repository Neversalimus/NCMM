name: NCMM Real Installation Matrix

on:
  push:
    branches:
      - main
    paths:
      - 'feed/index.json'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official CDDA release tag; blank uses first seed host'
        required: false
        type: string
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

concurrency:
  group: ncmm-real-installation-matrix
  cancel-in-progress: true

jobs:
  real-install-smoke:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout NCMM repository
        uses: actions/checkout@v4

      - name: Validate repository text encoding
        shell: powershell
        run: ./ci/Test-TextEncoding.ps1 -RepoRoot "$env:GITHUB_WORKSPACE"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build current runtime and modules
        shell: powershell
        run: |
          ./ci/Build-Runtime.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -OutputRoot "$env:GITHUB_WORKSPACE/dist/runtime"

      - name: Resolve official CDDA Windows asset
        id: release
        shell: powershell
        run: |
          $tag = '${{ inputs.upstream_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = @(Get-Content ci/seed-hosts.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ })[0]
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'No CDDA release tag available for real install smoke.' }
          $release = (& gh api "repos/CleverRaven/Cataclysm-DDA/releases/tags/$tag") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve official CDDA release $tag." }
          $asset = @($release.assets | Where-Object {
            $_.name -like 'cdda-windows-with-graphics-x64-*.zip'
          } | Sort-Object name | Select-Object -First 1)
          if (-not $asset) {
            $asset = @($release.assets | Where-Object {
              $_.name -like 'cdda-windows-with-graphics-and-sounds-x64-*.zip'
            } | Sort-Object name | Select-Object -First 1)
          }
          if (-not $asset) { throw "No official Windows graphics asset found for $tag." }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset=$([string]$asset.name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Real install target: $tag / $([string]$asset.name)"

      - name: Download and extract official CDDA
        id: game
        shell: powershell
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $asset = '${{ steps.release.outputs.asset }}'
          $download = Join-Path $env:RUNNER_TEMP 'ncmm-real-cdda'
          $extract = Join-Path $env:RUNNER_TEMP 'ncmm-real-cdda-extracted'
          New-Item -ItemType Directory -Force -Path $download,$extract | Out-Null
          & gh release download $tag -R CleverRaven/Cataclysm-DDA -p $asset -D $download --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download $tag / $asset" }
          $zip = Get-ChildItem $download -Filter '*.zip' -File | Select-Object -First 1
          if (-not $zip) { throw 'Downloaded CDDA archive is missing.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          $exe = @(Get-ChildItem $extract -Filter 'cataclysm-tiles.exe' -File -Recurse)
          if ($exe.Count -ne 1) { throw "Expected exactly one cataclysm-tiles.exe, found $($exe.Count)." }
          $root = $exe[0].Directory.FullName
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Official CDDA extracted to: $root"

      - name: Run production SetupCore on official CDDA
        shell: powershell
        run: |
          ./ci/Test-InstallationMatrix.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -PayloadRoot "$env:GITHUB_WORKSPACE/dist/runtime/payload" `
            -Mode Real `
            -GameRoot '${{ steps.game.outputs.root }}'

      - name: Launch certified Host twice through installed bootstrap
        shell: powershell
        timeout-minutes: 8
        run: |
          $root = '${{ steps.game.outputs.root }}'
          $exe = Join-Path $root 'cataclysm-tiles.exe'
          $ncmm = Join-Path $root 'ncmm'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Installed NCMM bootstrap is missing: $exe" }

          & $exe --ncmm-runtime-smoke --ncmm-refresh
          if ($LASTEXITCODE -ne 0) {
            throw "First real NCMM runtime smoke failed with exit $LASTEXITCODE."
          }
          if (Test-Path (Join-Path $ncmm 'boot.pending')) {
            throw 'First real runtime smoke left boot.pending.'
          }
          if (-not (Test-Path (Join-Path $ncmm 'boot.ready'))) {
            throw 'First real runtime smoke did not publish boot.ready.'
          }
          if (Test-Path (Join-Path $ncmm 'ncmm.auto_disabled')) {
            throw 'First real runtime smoke unexpectedly auto-disabled NCMM.'
          }

          & $exe --ncmm-runtime-smoke --ncmm-offline
          if ($LASTEXITCODE -ne 0) {
            throw "Second real NCMM runtime smoke failed with exit $LASTEXITCODE."
          }
          if (Test-Path (Join-Path $ncmm 'boot.pending')) {
            throw 'Second real runtime smoke left boot.pending.'
          }
          if (-not (Test-Path (Join-Path $ncmm 'boot.ready'))) {
            throw 'Second real runtime smoke did not publish boot.ready.'
          }
          if (Test-Path (Join-Path $ncmm 'ncmm.auto_disabled')) {
            throw 'Second real runtime smoke was misclassified as a crash.'
          }

      - name: Run AWS + Survivor real gameplay matrix
        shell: powershell
        timeout-minutes: 12
        run: |
          $root = '${{ steps.game.outputs.root }}'
          $exe = Join-Path $root 'cataclysm-tiles.exe'
          $ncmm = Join-Path $root 'ncmm'
          $seeds = @('NCMM-AWS-REAL-A','NCMM-AWS-REAL-B','NCMM-AWS-REAL-C')
          foreach ($seed in $seeds) {
            Write-Host "Real module gameplay smoke seed: $seed"
            & $exe --ncmm-runtime-smoke-gameplay --ncmm-offline --seed $seed
            if ($LASTEXITCODE -ne 0) {
              throw "Real module gameplay smoke failed for seed $seed with exit $LASTEXITCODE."
            }
            if (Test-Path (Join-Path $ncmm 'boot.pending')) {
              throw "Gameplay smoke $seed left boot.pending."
            }
            if (-not (Test-Path (Join-Path $ncmm 'boot.ready'))) {
              throw "Gameplay smoke $seed did not publish boot.ready."
            }
            if (Test-Path (Join-Path $ncmm 'ncmm.auto_disabled')) {
              throw "Gameplay smoke $seed unexpectedly auto-disabled NCMM."
            }
          }
          $evidence = @(Get-ChildItem $ncmm -Filter 'module-gameplay-smoke-*.json' -File)
          if ($evidence.Count -ne $seeds.Count) {
            throw "Expected $($seeds.Count) gameplay evidence files, found $($evidence.Count)."
          }

          $seenSeeds = @{}
          foreach ($file in $evidence) {
            try {
              $proof = Get-Content $file.FullName -Raw | ConvertFrom-Json
            } catch {
              throw "Gameplay evidence is not valid JSON: $($file.FullName)"
            }
            if ([int]$proof.schema -ne 1) { throw "Gameplay evidence schema mismatch: $($file.Name)" }
            if ([int]$proof.aws_settings -ne 48) { throw "AWS setting coverage mismatch: $($file.Name)" }
            if ($proof.aws_world_saved -ne $true) { throw "AWS world was not saved: $($file.Name)" }
            if ($proof.aws_world_reloaded -ne $true) { throw "AWS world was not reloaded: $($file.Name)" }
            if ($proof.aws_overmap_generated -ne $true) { throw "AWS overmap was not generated: $($file.Name)" }
            if ([int]$proof.survivor_catalog -ne 369) { throw "Survivor catalog coverage mismatch: $($file.Name)" }
            if ([int]$proof.survivor_perks_exercised -ne 369) { throw "Survivor full-catalog gameplay coverage mismatch: $($file.Name)" }
            if ([int]$proof.survivor_effect_assertions -le 0) { throw "Survivor real Host effect assertions missing: $($file.Name)" }
            if ([int]$proof.survivor_integrations_inert -le 0) { throw "Survivor conditional integration coverage missing: $($file.Name)" }
            if ([int]$proof.survivor_real_character_checks -ne 9) { throw "Survivor real Character coverage mismatch: $($file.Name)" }
            if ($proof.survivor_cleanup -ne $true) { throw "Survivor cleanup failed: $($file.Name)" }
            if ([string]::IsNullOrWhiteSpace([string]$proof.world) -or
                -not ([string]$proof.world).StartsWith('NCMM_AWS_SMOKE_')) {
              throw "Gameplay evidence world name is invalid: $($file.Name)"
            }
            $seedKey = [string]$proof.seed
            if ($seenSeeds.ContainsKey($seedKey)) { throw "Duplicate gameplay evidence seed: $seedKey" }
            $seenSeeds[$seedKey] = $true
          }
          if ($seenSeeds.Count -ne $seeds.Count) {
            throw "Gameplay evidence did not contain $($seeds.Count) distinct seeds."
          }
          Write-Host "Real AWS + Survivor gameplay evidence: PASS ($($evidence.Count) worlds)"

      - name: Verify certified Host + modules and restore vanilla
        shell: powershell
        run: |
          ./ci/Test-InstallationMatrix.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE" `
            -PayloadRoot "$env:GITHUB_WORKSPACE/dist/runtime/payload" `
            -Mode Real `
            -RealPhase PostRuntime `
            -GameRoot '${{ steps.game.outputs.root }}'

      - name: Publish real-install evidence
        if: always()
        shell: powershell
        run: |
          $root = '${{ steps.game.outputs.root }}'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'dist/real-install-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          foreach ($name in @('VERSION.txt','cataclysm-tiles.exe','cataclysm-tiles.vanilla.exe')) {
            $path = Join-Path $root $name
            if (Test-Path $path -PathType Leaf) {
              if ($name -like '*.exe') {
                $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
                Set-Content (Join-Path $evidence ($name + '.sha256.txt')) -Value $hash -Encoding Ascii
              } else { Copy-Item $path (Join-Path $evidence $name) -Force }
            }
          }
          foreach ($name in @(
            'installed-components.json','bootstrap.sha256','vanilla.sha256',
            'runtime.state.json','modules.state.json','host.binding.json',
            'bootstrap.log','ncmm.log','boot.ready'
          )) {
            $path = Join-Path $root ('ncmm\' + $name)
            if (Test-Path $path -PathType Leaf) { Copy-Item $path (Join-Path $evidence $name) -Force }
          }
          Get-ChildItem (Join-Path $root 'ncmm') -Filter 'module-gameplay-smoke-*.json' -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $evidence $_.Name) -Force }
          "## NCMM real runtime smoke" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- CDDA: ${{ steps.release.outputs.tag }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- production SetupCore: install / module switch / reinstall" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- bootstrap -> certified Host -> AWS + Survivor -> boot.ready -> clean exit: two consecutive real launches" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- gameplay: 3 deterministic randomized AWS worlds + real overmap generation + all 369 Survivor perks exercised through the real Host + 9 direct Character checks per world" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- RestoreVanilla: verified by SHA-256" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncmm-real-install-${{ steps.release.outputs.tag }}
          path: dist/real-install-evidence/**
          if-no-files-found: warn
