name: PR190 input preflight qualification
on:
  push:
    branches: [audit/full-system-20261009]
    paths: [.github/workflows/ncmm-pr190-preflight-qualification.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ccbc49529cfcfb6f6b850c31f6f04c2be2ec0dd
      - uses: microsoft/setup-msbuild@v2
      - name: Apply exact input validation patch
        shell: python
        run: |
          import base64, zlib, hashlib, subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == '3ccbc49529cfcfb6f6b850c31f6f04c2be2ec0dd'
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a773e1b7aa1eea748fe8dc3abac50fefe834b13438fb137225346064c27ee9a1'
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
      - name: Regenerate and verify canonical sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path -Check
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path -Check
          ./ci/Test-Infrastructure083.ps1 -PackageRoot $PWD.Path
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'Whitespace guard failed'}
      - name: Full Windows runtime and installation matrix
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $stdout=Join-Path $PWD 'evidence/runtime.stdout.log'
          $stderr=Join-Path $PWD 'evidence/runtime.stderr.log'
          $script=Join-Path $PWD 'ci/Build-Runtime.ps1'
          $output=Join-Path $env:RUNNER_TEMP 'ncmm-preflight-runtime'
          $args=@('-NoProfile','-ExecutionPolicy','Bypass','-File',('"'+$script+'"'),'-RepositoryRoot',('"'+$PWD.Path+'"'),'-OutputRoot',('"'+$output+'"'))
          $p=Start-Process powershell.exe -ArgumentList $args -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout -Tail 100
          Get-Content $stderr -Tail 50
          if($p.ExitCode -ne 0){throw ('Full Windows runtime failed: '+$p.ExitCode)}
      - name: Persist tested candidate, without modifying PR or main
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changed.txt
          if grep -E '^(.github/|feed/)' /tmp/changed.txt; then echo 'Unexpected release or workflow mutation'; exit 1; fi
          git config user.name 'NCMM Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/NCMMSetupCore.cs tests/InstallationMatrixHarness.cs docs/audit/2026-10-09-remediation.md payload/SURVIVOR_0911_0915_v8.7.6.8.ps1 compat/package.integrity.json
          git commit -m 'Validate installer inputs before lock creation and consume lazy selections once'
          git push origin HEAD:refs/heads/audit/pr190-input-validation-ready
          git rev-parse HEAD > evidence/source-sha.txt
          git show --stat > evidence/changes.txt
          git archive --format=zip HEAD -o evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NCMM-PR190-input-preflight-evidence
          path: evidence/*
          if-no-files-found: error
          retention-days: 7
