name: First Person GPU device and UI qualification
on:
  pull_request:
    paths: ['experiments/FirstPersonView/src/**', 'experiments/FirstPersonView/shaders/**', 'experiments/FirstPersonView/CMakeLists.txt', 'experiments/FirstPersonView/compile_gpu_shaders.py', 'experiments/FirstPersonView/tests/gpu*', 'experiments/graphics_bridge/ncmm_gpu*', 'experiments/graphics_bridge/ncmm_graphics_gpu.h', '.github/workflows/ncmm-gpu-device.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ncmm-gpu-device-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SDL_ASSERT: abort
      VCPKG_OVERLAY_TRIPLETS: '${{ github.workspace }}/gpu-upstream/.github/vcpkg_triplets'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 074aa98bd5be3de4c35f154082db32a0e63bb0f1
          path: gpu-upstream
          sparse-checkout: |
            msvc-full-features
            .github/vcpkg_triplets
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: f6672d8e480ccdecddfad3fd1b838ba369ffe6cd
      - uses: actions/cache@v4
        with:
          path: gpu-upstream/msvc-full-features/vcpkg_installed
          key: ncmm-vcpkg-${{ runner.os }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd-${{ hashFiles('gpu-upstream/msvc-full-features/vcpkg.json', 'gpu-upstream/.github/vcpkg_triplets/x64-windows-static.cmake') }}
      - name: Install the exact existing SDL3 and shader tool dependencies
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows-static --x-manifest-root=gpu-upstream/msvc-full-features --x-install-root=gpu-upstream/msvc-full-features/vcpkg_installed/x64-windows-static
          if($LASTEXITCODE -ne 0){throw 'Pinned GPU dependencies failed.'}
      - name: Compile owned SPIR-V and DXIL shaders
        shell: pwsh
        run: |
          $root=Join-Path $PWD 'gpu-upstream/msvc-full-features/vcpkg_installed/x64-windows-static/x64-windows-static'
          python experiments/FirstPersonView/compile_gpu_shaders.py --glslang "$root/tools/glslang/glslangValidator.exe" --shadercross "$root/tools/sdl3-shadercross/shadercross.exe" --output "$PWD/gpu-shader-bytes.hpp"
          if($LASTEXITCODE -ne 0){throw 'Actual shader compilation failed.'}
      - name: Build actual GPU pipeline probe
        shell: pwsh
        run: |
          cmake -S experiments/FirstPersonView -B gpu-build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_INSTALLED_DIR="$PWD/gpu-upstream/msvc-full-features/vcpkg_installed/x64-windows-static" -DFIRST_PERSON_BUILD_GPU_TESTS=ON -DFIRST_PERSON_GPU_SHADER_HEADER="$PWD/gpu-shader-bytes.hpp"
          if($LASTEXITCODE -ne 0){throw 'GPU probe configuration failed.'}
          cmake --build gpu-build --config Release --target first_person_gpu_probe_tests first_person_gpu_contract_tests first_person_gpu_scene_tests
          if($LASTEXITCODE -ne 0){throw 'GPU probe build failed.'}
      - name: Require real draw commands, hardware depth and ordinary SDL UI
        run: ctest --test-dir gpu-build -C Release -R "gpu_probe|gpu_contract|gpu_scene" --output-on-failure
      - name: Compare every existing normalized GPU image with the original scratch policy
        shell: pwsh
        run: |
          python -B experiments/FirstPersonView/tests/compare_scratch_reuse.py --repository . --output scratch-pair --toolchain-file "$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" --vcpkg-triplet x64-windows-static --vcpkg-installed-dir "$PWD/gpu-upstream/msvc-full-features/vcpkg_installed/x64-windows-static" --shader-header gpu-shader-bytes.hpp
          if($LASTEXITCODE -ne 0){throw 'Full scratch-reuse pixel comparison failed.'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-device-windows
          path: |
            gpu-build/gpu-probe.*
            gpu-build/gpu-scene*
            scratch-pair/comparison.json
            scratch-pair/build.log
            scratch-pair/reference/run/
            scratch-pair/candidate/run/
            gpu-build/Release/first_person_gpu_scene_tests.exe
            gpu-build/Release/first_person_gpu_probe_tests.exe
            gpu-shader-bytes.hpp
          retention-days: 14
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SDL_ASSERT: abort
      SDL_VIDEODRIVER: offscreen
      SDL_GPU_DRIVER: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 8e37db5e797b6167f3a00d697d816a684bd259c7
          path: gpu-sdl
      - name: Install software Vulkan device and shader compiler
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers glslang-tools libvulkan-dev zlib1g-dev
      - name: Build exact SDL 3.4.10 for offscreen shared-device testing
        run: |
          cmake -S gpu-sdl -B gpu-sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_AUDIO=OFF -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF -DSDL_SENSOR=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF -DSDL_VULKAN=ON -DSDL_GPU=ON -DSDL_TESTS=OFF
          cmake --build gpu-sdl-build --parallel 2
      - name: Compile owned SPIR-V shader programs
        run: python3 experiments/FirstPersonView/compile_gpu_shaders.py --glslang /usr/bin/glslangValidator --output "$PWD/gpu-shader-bytes.hpp"
      - name: Build and execute genuine Vulkan geometry and depth
        run: |
          cmake -S experiments/FirstPersonView -B gpu-build -DCMAKE_BUILD_TYPE=Release -DSDL3_DIR="$PWD/gpu-sdl-build" -DFIRST_PERSON_BUILD_GPU_TESTS=ON -DFIRST_PERSON_GPU_SHADER_HEADER="$PWD/gpu-shader-bytes.hpp"
          cmake --build gpu-build --parallel 2 --target first_person_gpu_probe_tests first_person_gpu_contract_tests first_person_gpu_scene_tests
          ctest --test-dir gpu-build -R "gpu_probe|gpu_contract|gpu_scene" --output-on-failure
      - name: Compare every existing normalized Vulkan image with the original scratch policy
        run: python3 -B experiments/FirstPersonView/tests/compare_scratch_reuse.py --repository . --output scratch-pair --sdl-dir gpu-sdl-build --shader-header gpu-shader-bytes.hpp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-device-linux
          path: |
            gpu-build/gpu-probe.*
            gpu-build/gpu-scene*
            scratch-pair/comparison.json
            scratch-pair/build.log
            scratch-pair/reference/run/
            scratch-pair/candidate/run/
          retention-days: 14
  clang_asan_ubsan_vulkan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SDL_ASSERT: abort
      SDL_VIDEODRIVER: offscreen
      SDL_GPU_DRIVER: vulkan
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Require exact candidate runtime bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          files={
            'experiments/FirstPersonView/CMakeLists.txt':'144be87ece70d7523619d42c9c540a1a3d2f5403e1014cd259ff7d9e4c2df2a0',
            'experiments/FirstPersonView/tests/gpu_resource_failure_test.cpp':'d1f3ca167b1639d8be40ec0dcff5d43ae612ff0baf89fe003fc1532418160597',
            'experiments/FirstPersonView/tests/gpu_vertex_lease_edge_test.cpp':'f4d63a3d214af23d48000bd919da261a946c7f55c30720ef9f5bd41a35cb4a0b',
            'experiments/graphics_bridge/ncmm_gpu_resources.hpp':'967056405be15fc7dbf7e707bac9374346bc209a4630406fd40542bf2954f2e9',
            'experiments/graphics_bridge/ncmm_gpu_geometry.hpp':'0b4908e30c9855d78466fad31f9c194a057268d4d2a82d1397fb57c504618e9d',
            'experiments/graphics_bridge/ncmm_gpu_backend.hpp':'2c6a31754b82c6b1bec8b03efaffc97603132107d16b604b0ad60265bcc4f6d4',
            'experiments/graphics_bridge/ncmm_graphics_movement_benchmark.inc':'bb4099d9eb5802d0e173ce9d7b21d5756643ca3ef9e7927c6cf223f23244a8ba',
            'experiments/FirstPersonView/tests/compare_scratch_reuse.py':'c170dd70d01dfd4c5b9858aedb5bc558d013a2d768b3b1cc4b044241d74448ba',
            'experiments/FirstPersonView/tests/gpu_resource_cache_test.cpp':'0c8d4687aef0ffb225a25daaa14d693296c45ef754889962a8e468f92d9cdc8d',
            'experiments/FirstPersonView/src/gpu_scene.hpp':'cdb2e55c5f53b0631d637c14d204c6c520c7210fdb1f51ac1e9d2ac369689e48',
            'experiments/FirstPersonView/src/hybrid_renderer.hpp':'02735b0f021379598afd3db97954a087852dc38a135781453ae7c03feea3bd9e',
            'experiments/FirstPersonView/tests/viewmodel_gpu_test.cpp':'4297305f7cc2f99026373322b42b6bcc07ec97c01da8af706a564296608bd3ef',
            'experiments/FirstPersonView/src/multilevel_geometry.inc':'f9ea18b3a9f6e62ff6683bc16985a707256651093cc71ea91f0313538b216419',
            'experiments/FirstPersonView/src/grass.inc':'2adf955130f9e16d40ab965a98c5d4ce4e28ff6472982a577f17f75fa27889e3',
            'experiments/FirstPersonView/tests/gpu_scene_test.cpp':'4669707b66a347a23474f10b96bd592f36085979757af06bebece4ff89206644',
            'experiments/graphics_bridge/ncmm_graphics_grass.hpp':'aaa78c29550b06ab1ff24bf8c8eddc5d5572d9a4fbbf269ee40a15e4b4f3a825',
            'experiments/graphics_bridge/ncmm_world_policy.hpp':'ffb3e6f3ce066293593dd7520048f2305291d6d524b0dc39affc529c91e342cb',
            'experiments/FirstPersonView/src/rail.inc':'701ca6374ab6c49a0c6700aa2a1d20f1fb63eb4787377cba344bd4f115ade0ad',
            'experiments/graphics_bridge/ncmm_graphics_rail.hpp':'cc6add27ab26abc50af75cab79b89785d2f6707cf3b4a1ce2694fac779cec914',
            'experiments/graphics_bridge/fps_input_bridge.py':'29a8e8209e993c499f3ae2d21ee1827bda4fc5c69bcd81f11036df8c19876876',
            'experiments/graphics_bridge/ncmm_graphics_input.hpp':'34bf85d890aa2e2774ead961e4df03a74c8e291f7d82d8e7f05dc771bd88deb4',
            'experiments/graphics_bridge/ncmm_graphics_fps.inc':'85ce095b3acecbe4539fbdb6dbe4dd28df091c632cf77a9b115bd6cb00dbd2b0',
            'experiments/graphics_bridge/ncmm_graphics_controls.inc':'f8c13720258265e5a5e7ec2bdbdb30d8a3af0f0840c37192cf6df4c32727adbd',
            'experiments/graphics_bridge/ncmm_graphics_presentation.inc':'685045316fb9ed81ac96ec25f666d23dff6d3ccab2eb6268cff61e1fcf59d7cf',
            'experiments/graphics_bridge/ncmm_graphics_presentation.h':'cc7d7db6318db55c9408083ba1dcec29b2b13228f3d5f06097f1f4a70f6237fa',
            'experiments/FirstPersonView/src/animation.hpp':'1ba0c0b8cd919a41f03806e07bc6de5298063ca9cdfbc5d019344c3b4e9a6411',
            'experiments/FirstPersonView/src/module.cpp':'8e7f2e7cdad16e3d7d665cf468026e01df11ec731df8b0d3f8da3c546c009d96'}
          for name,expected in files.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          Path('vertex-source-proof.json').write_text(json.dumps(dict(runtime_source=os.environ['GITHUB_SHA'],files=files,ordinary_performance=False,actual_native_game=False,device='offscreen software Vulkan; not RTX4090'),indent=2)+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 8e37db5e797b6167f3a00d697d816a684bd259c7
          path: gpu-sdl
      - name: Install software Vulkan and shader compiler
        run: sudo apt-get update && sudo apt-get install -y clang mesa-vulkan-drivers glslang-tools libvulkan-dev zlib1g-dev
      - name: Bind the declared software device without unrelated ICD enumeration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          assert os.geteuid()!=0
          manifests=list(Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'));assert len(manifests)==1
          path=manifests[0].resolve()
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:stream.write('VK_DRIVER_FILES='+str(path)+'\n')
          Path('lvp-fixture.json').write_text(json.dumps(dict(device_policy='same llvmpipe software adapter as original runs; restrict discovery to its ICD',manifest=str(path),sha256=hashlib.sha256(path.read_bytes()).hexdigest(),euid=os.geteuid(),asan_options=os.environ['ASAN_OPTIONS'],ubsan_options=os.environ['UBSAN_OPTIONS'],no_suppressions=True,original_default_driver_failures_retained=True,ordinary_performance=False),indent=2)+'\n')
          PY
      - name: Build pinned SDL3.4.10 offscreen Vulkan
        run: |
          cmake -S gpu-sdl -B gpu-sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_AUDIO=OFF -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF -DSDL_SENSOR=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF -DSDL_VULKAN=ON -DSDL_GPU=ON -DSDL_TESTS=OFF
          cmake --build gpu-sdl-build --parallel 2
      - name: Compile unchanged shipping shaders to SPIR-V
        run: python3 experiments/FirstPersonView/compile_gpu_shaders.py --glslang /usr/bin/glslangValidator --output "$PWD/gpu-shader-bytes.hpp"
      - name: Build actual GPU resource and scene tests with ASan and UBSan
        run: |
          cmake -S experiments/FirstPersonView -B vertex-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DSDL3_DIR="$PWD/gpu-sdl-build" -DFIRST_PERSON_BUILD_GPU_TESTS=ON -DFIRST_PERSON_SANITIZE=ON -DFIRST_PERSON_GPU_SHADER_HEADER="$PWD/gpu-shader-bytes.hpp"
          cmake --build vertex-asan --parallel 2 --target first_person_gpu_resource_cache_tests first_person_gpu_scene_tests first_person_gpu_vertex_lease_edge_tests first_person_gpu_resource_failure_tests
      - name: Verify exact GPU bytes, lease lifetime, picking and depth without suppressions
        run: ctest --test-dir vertex-asan -R '^first_person_gpu_(resource_cache|scene|vertex_lease_edge|resource_failure)$' --output-on-failure -V
      - name: Compare all normalized Vulkan images with ASan UBSan and exit leak checks
        run: python3 -B experiments/FirstPersonView/tests/compare_scratch_reuse.py --repository . --output scratch-pair-asan --sdl-dir gpu-sdl-build --shader-header gpu-shader-bytes.hpp --sanitize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-vertex-linux-asan-ubsan
          path: |
            vertex-source-proof.json
            lvp-fixture.json
            scratch-pair-asan/comparison.json
            scratch-pair-asan/build.log
            scratch-pair-asan/reference/run/
            scratch-pair-asan/candidate/run/
            vertex-asan/Testing/Temporary/LastTest.log
            vertex-asan/CMakeCache.txt
            vertex-asan/gpu-scene*
            gpu-shader-bytes.hpp
          retention-days: 14
