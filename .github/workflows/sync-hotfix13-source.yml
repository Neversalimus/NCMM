name: Sync HOTFIX13 source tree

on:
  push:
    branches: [main]
    paths:
      - "packages/NCMM_INFRASTRUCTURE_v0.8.3.1_SURVIVOR_0.11.3_COMBINATORIAL_EDGE_POLISH_HOTFIX13.zip"
      - ".github/workflows/sync-hotfix13-source.yml"

permissions:
  contents: write

concurrency:
  group: ncmm-hotfix13-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect exact package
        id: package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "packages\NCMM_INFRASTRUCTURE_v0.8.3.1_SURVIVOR_0.11.3_COMBINATORIAL_EDGE_POLISH_HOTFIX13.zip"
          if (Test-Path $package -PathType Leaf) {
            "run=true" >> $env:GITHUB_OUTPUT
          } else {
            "run=false" >> $env:GITHUB_OUTPUT
            Write-Host "Exact HOTFIX13 package is not present yet; nothing to synchronize."
          }

      - name: Verify exact package
        if: steps.package.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:GITHUB_WORKSPACE "packages\NCMM_INFRASTRUCTURE_v0.8.3.1_SURVIVOR_0.11.3_COMBINATORIAL_EDGE_POLISH_HOTFIX13.zip"
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "62cd6fabfc9ecf9824f8d77d27e177f02f909b88dacd7ea9a81d8852e1abf748") {
            throw "HOTFIX13 SHA-256 mismatch: $hash"
          }
          Write-Host "Exact HOTFIX13 package verified: $hash"

      - name: Generate final NCMM source state
        if: steps.package.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:GITHUB_WORKSPACE "packages\NCMM_INFRASTRUCTURE_v0.8.3.1_SURVIVOR_0.11.3_COMBINATORIAL_EDGE_POLISH_HOTFIX13.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ncmm-hotfix13"
          $buildRoot = Join-Path $env:RUNNER_TEMP "ncmm-source-sync-build"
          Remove-Item $extract,$buildRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $package -DestinationPath $extract -Force

          $payload = Join-Path $extract "payload\SURVIVOR_0911_0915_v8.7.6.8.ps1"
          if (-not (Test-Path $payload -PathType Leaf)) { throw "Payload engine missing from exact package." }

          $sourceOnly = Join-Path $env:RUNNER_TEMP "SURVIVOR_SOURCE_SYNC.ps1"
          $text = [IO.File]::ReadAllText($payload)

          # The production payload validates a local CDDA installation before generating NCMM sources.
          # Repository synchronization has no installed game, so bypass only that local-runtime preflight.
          $gameStart = '$GameRoot = Resolve-GameRoot $GameRoot $CddaCommit $CddaFolder'
          $gameEnd = '# v4 portability fix:'
          $a = $text.IndexOf($gameStart)
          $b = $text.IndexOf($gameEnd, $a)
          if ($a -lt 0 -or $b -le $a) {
            throw "Could not isolate runtime game-root preflight."
          }
          $gameBypass = @'
$GameRoot = $env:RUNNER_TEMP
Write-Host "Repository source-sync mode: local game-root preflight intentionally bypassed." -ForegroundColor DarkCyan

'@
          $text = $text.Substring(0,$a) + $gameBypass + $text.Substring($b)

          # Stop after all NCMM/Survivor/AWS transforms and source audits, before CDDA/toolchain work.
          $stopMarker = '# NCMM Infrastructure 0.8.0 deep probe: execute the exact host/source transform stack'
          $stop = $text.IndexOf($stopMarker)
          if ($stop -lt 0) {
            throw "Source-generation stop marker missing."
          }
          $stopCode = @'
Write-Host "Repository source-sync generation complete; stopping before CDDA/toolchain work." -ForegroundColor Green
exit 0

'@
          $text = $text.Substring(0,$stop) + $stopCode + $text.Substring($stop)
          [IO.File]::WriteAllText($sourceOnly,$text,(New-Object Text.UTF8Encoding($false)))

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $sourceOnly -BuildRoot $buildRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Source-generation payload failed with exit code $LASTEXITCODE."
          }

          $generated = Join-Path $buildRoot "ncmm_0910_work"
          if (-not (Test-Path $generated -PathType Container)) {
            throw "Generated NCMM work tree missing."
          }

          $survivorManifestPath = Join-Path $generated "mods\SurvivorProgression\mod.json"
          $awsManifestPath = Join-Path $generated "mods\AdvancedWorldSettings\mod.json"
          $sdkPath = Join-Path $generated "sdk\ncmm_api.h"
          $loaderPath = Join-Path $generated "host_patch\ncmm_loader.cpp"
          foreach ($required in @($survivorManifestPath,$awsManifestPath,$sdkPath,$loaderPath)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Generated source is incomplete: $required"
            }
          }

          $survivorManifest = Get-Content $survivorManifestPath -Raw | ConvertFrom-Json
          $awsManifest = Get-Content $awsManifestPath -Raw | ConvertFrom-Json
          $sdk = [IO.File]::ReadAllText($sdkPath)
          $loader = [IO.File]::ReadAllText($loaderPath)

          if ([string]$survivorManifest.version -ne "0.11.3") {
            throw "Generated Survivor version is not 0.11.3: $($survivorManifest.version)"
          }
          if ([string]$awsManifest.version -ne "0.6.2") {
            throw "Generated AWS version is not 0.6.2: $($awsManifest.version)"
          }
          if (-not $sdk.Contains('#define NCMM_API_VERSION_MINOR 9u') -or
              -not $sdk.Contains('NCMM_HOST_API_V2_CORE_MAJOR 2u')) {
            throw "Generated SDK is not Host API 2.0 / legacy bridge 1.9."
          }
          if (-not $loader.Contains('return "0.8.0";')) {
            throw "Generated Host version is not 0.8.0."
          }
          if (-not $loader.Contains('g->new_game')) {
            throw "Generated Host is missing the chargen lifecycle guard."
          }

          # Replace source-owned trees with their fully transformed output.
          foreach ($dir in @("host_patch","mods","runtime","sdk","tests","ci")) {
            $src = Join-Path $generated $dir
            if (-not (Test-Path $src -PathType Container)) { continue }
            $dst = Join-Path $env:GITHUB_WORKSPACE $dir
            if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
            New-Item -ItemType Directory -Force $dst | Out-Null
            Copy-Item (Join-Path $src "*") $dst -Recurse -Force
          }

          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE "compat") | Out-Null
          Copy-Item (Join-Path $generated "compat\contracts.json") (Join-Path $env:GITHUB_WORKSPACE "compat\contracts.json") -Force

          # Overlay the exact Infrastructure 0.8.3.1 package additively.
          # Package-owned infrastructure becomes byte-identical to HOTFIX13 while repository-only
          # documentation/source history remains present.
          Get-ChildItem $extract -Force | ForEach-Object {
            $target = Join-Path $env:GITHUB_WORKSPACE $_.Name
            if ($_.PSIsContainer) {
              New-Item -ItemType Directory -Force $target | Out-Null
              Copy-Item (Join-Path $_.FullName "*") $target -Recurse -Force
            } else {
              Copy-Item $_.FullName $target -Force
            }
          }

          # The synchronization workflow is repository infrastructure, not package payload.
          # Keep the checked-in workflow version rather than any package overlay.
          git checkout HEAD -- ".github/workflows/sync-hotfix13-source.yml"

      - name: Commit synchronized source
        if: steps.package.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "NCMM Source Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Repository already matches HOTFIX13 source state."
            exit 0
          }

          git commit -m "sync: Infrastructure 0.8.3.1 / Survivor 0.11.3 source state"
          git pull --rebase origin main
          git push origin HEAD:main
