name: Blocking · NCMM Source/Package Audit

on:
  push:
    branches: [main]
    paths:
      - 'mods/SurvivorProgression/**'
      - 'mods/AdvancedWorldSettings/**'
      - 'host_patch/ncmm_loader.cpp'
      - 'payload/SURVIVOR_0911_0915_v8.7.6.8.ps1'
      - 'ci/Test-UserFacingCopy.ps1'
      - 'ci/Build-HostPackage.ps1'
      - 'ci/Test-SourceContracts.ps1'
      - 'ci/Test-Infrastructure083.ps1'
      - 'ci/Test-ComponentCatalog.ps1'
      - 'ci/Test-HostPatchDomains.ps1'
      - 'ci/Test-EquipmentBodyMapUX.ps1'
      - 'ci/HostPatchDomains.ps1'
      - 'ci/host-patch-domains.json'
      - 'ci/NativeModuleCatalog.ps1'
      - 'ci/Test-NativeModuleCatalog.ps1'
      - 'ci/Test-NCMMNativeScaffold.ps1'
      - 'ci/Test-NCMMModuleRegistrationPreview.ps1'
      - 'tools/New-NCMMModuleRegistrationPreview.ps1'
      - 'tools/New-NCMMNativeModule.ps1'
      - 'sdk/**'
      - 'ci/Test-InstallerTransaction.ps1'
      - 'ci/Test-HostPayloadContracts.ps1'
      - 'ci/Test-SurvivorPayloadContracts.ps1'
      - 'ci/Regenerate-PackageIntegrity.ps1'
      - 'ci/Sync-CanonicalPayload.ps1'
      - 'ci/Test-CanonicalPayloadSync.ps1'
      - 'tests/smoke_host.cpp'
      - 'tests/sdk_core_guard_test.cpp'
      - 'sdk/**'
      - 'tools/New-NCMMNativeModule.ps1'
      - 'runtime/NCMMBootstrap.cs'
      - 'compat/package-files.txt'
      - 'compat/package.integrity.json'
      - 'compat/compatibility.manifest.json'
      - 'internal/stages/**'
      - 'ci/Build-Runtime.ps1'
      - 'tools/NCMM.Update.Common.ps1'
      - 'tools/NCMM.Infrastructure.Common.ps1'
      - 'tools/NCMM.Infrastructure.Core.ps1'
      - 'tools/NCMM.Infrastructure.Package.ps1'
      - 'tools/NCMM.Infrastructure.Transaction.ps1'
      - 'components/**'
      - 'runtime/NCMMSetup.cs'
      - 'runtime/NCMMSetupCore.cs'
      - 'runtime/NCMMSetupDiagnostics.cs'
      - 'tests/DiagnosticsHarness.cs'
      - '.github/workflows/ncmm-text-audit.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncmm-player-facing-text-audit-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout NCMM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit checked-in player-facing text
        shell: powershell
        run: |
          .\ci\Test-UserFacingCopy.ps1 -SourceRoot "$env:GITHUB_WORKSPACE"

      - name: Check canonical source snapshots
        shell: powershell
        run: |
          .\ci\Sync-CanonicalPayload.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE" -Check

      - name: Test canonical snapshot synchronization guards
        shell: powershell
        run: |
          .\ci\Test-CanonicalPayloadSync.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Validate package integrity freshness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\ci\Regenerate-PackageIntegrity.ps1 -PackageRoot "$env:GITHUB_WORKSPACE" -Check

      - name: Validate Infrastructure package contract
        shell: powershell
        run: |
          .\ci\Test-Infrastructure083.ps1 -PackageRoot "$env:GITHUB_WORKSPACE"

      - name: Validate native module build registry and mutation guards
        shell: powershell
        run: .\ci\Test-NativeModuleCatalog.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Verify SDK generator isolation, manifests and rejection matrix
        shell: powershell
        run: .\ci\Test-NCMMNativeScaffold.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Verify Host patch domain graph and fail-closed mutation fixtures
        shell: powershell
        run: .\ci\Test-HostPatchDomains.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Validate equipment paper doll and mouse hitbox geometry
        shell: powershell
        run: .\ci\Test-EquipmentBodyMapUX.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Test isolated new module registration previews
        shell: powershell
        run: .\ci\Test-NCMMModuleRegistrationPreview.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Regenerate final module sources from payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:GITHUB_WORKSPACE 'payload\SURVIVOR_0911_0915_v8.7.6.8.ps1'
          $sourceOnly = Join-Path $env:RUNNER_TEMP 'SURVIVOR_COPY_AUDIT_GENERATOR.ps1'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'ncmm-copy-audit-build'
          Remove-Item $buildRoot -Recurse -Force -ErrorAction SilentlyContinue

          $text = [IO.File]::ReadAllText($payload)
          $gameStart = '$GameRoot = Resolve-GameRoot $GameRoot $CddaCommit $CddaFolder'
          $gameEnd = '# v4 portability fix:'
          $a = $text.IndexOf($gameStart)
          $b = $text.IndexOf($gameEnd,$a)
          if($a -lt 0 -or $b -le $a){throw 'Could not isolate runtime game-root preflight.'}
          $bypass = '$GameRoot = $env:RUNNER_TEMP' + [Environment]::NewLine +
                    'Write-Host "Copy-audit source generation: game-root preflight bypassed." -ForegroundColor DarkCyan' +
                    [Environment]::NewLine + [Environment]::NewLine
          $text = $text.Substring(0,$a) + $bypass + $text.Substring($b)

          $stopMarker = '# NCMM Infrastructure 0.8.3.1 deep probe: execute the exact host/source transform stack'
          $stop = $text.IndexOf($stopMarker)
          if($stop -lt 0){throw 'Source-generation stop marker missing.'}
          $stopCode = 'Write-Host "Copy-audit source generation complete." -ForegroundColor Green' +
                      [Environment]::NewLine + 'exit 0' + [Environment]::NewLine + [Environment]::NewLine
          $text = $text.Substring(0,$stop) + $stopCode + $text.Substring($stop)
          [IO.File]::WriteAllText($sourceOnly,$text,(New-Object Text.UTF8Encoding($true)))

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $sourceOnly -BuildRoot $buildRoot
          if($LASTEXITCODE -ne 0){throw "Source generation failed with exit code $LASTEXITCODE."}

          $generated = Join-Path $buildRoot 'ncmm_0910_work'
          if(-not(Test-Path $generated -PathType Container)){throw 'Generated source tree missing.'}

          .\ci\Test-UserFacingCopy.ps1 -SourceRoot $generated

          foreach($rel in @(
            'mods\SurvivorProgression\src\survivor_progression.cpp',
            'mods\AdvancedWorldSettings\src\aws.cpp',
            'host_patch\ncmm_loader.cpp'
          )){
            $repoText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $rel)).Replace("`r`n","`n")
            $genText = [IO.File]::ReadAllText((Join-Path $generated $rel)).Replace("`r`n","`n")
            if($repoText -ne $genText){
              $repoLines = $repoText -split "`n",-1
              $genLines = $genText -split "`n",-1
              $max = [Math]::Max($repoLines.Count,$genLines.Count)
              $shown = 0
              Write-Host ("Generated source drift details: " + $rel) -ForegroundColor Yellow
              for($i=0; $i -lt $max -and $shown -lt 40; ++$i){
                $r = if($i -lt $repoLines.Count){$repoLines[$i]}else{"<EOF>"}
                $g = if($i -lt $genLines.Count){$genLines[$i]}else{"<EOF>"}
                if($r -ne $g){
                  Write-Host ("  line {0}" -f ($i+1))
                  Write-Host ("    repo: " + $r)
                  Write-Host ("    gen : " + $g)
                  ++$shown
                }
              }
              throw "Generated source drift: $rel"
            }
          }
          Write-Host 'Payload-generated source matches checked-in source: PASS' -ForegroundColor Green

      - name: Build clean install package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          . .\tools\NCMM.Infrastructure.Common.ps1
          [void](Assert-NcmmPackageIntegrity $env:GITHUB_WORKSPACE)
          $integrity = Get-Content .\compat\package.integrity.json -Raw | ConvertFrom-Json
          $stage = Join-Path $env:RUNNER_TEMP 'ncmm-text-polish-package'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact-output'
          Remove-Item $stage,$out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage,$out | Out-Null

          foreach($entry in @($integrity.files)){
            $rel = ([string]$entry.path).Replace('\',[IO.Path]::DirectorySeparatorChar)
            $src = Join-Path $env:GITHUB_WORKSPACE $rel
            $dst = Join-Path $stage $rel
            New-Item -ItemType Directory -Force (Split-Path $dst -Parent) | Out-Null
            Copy-Item -LiteralPath $src -Destination $dst -Force
          }
          New-Item -ItemType Directory -Force (Join-Path $stage 'compat') | Out-Null
          Copy-Item .\compat\package.integrity.json (Join-Path $stage 'compat\package.integrity.json') -Force

          $zip = Join-Path $out 'NCMM_INFRASTRUCTURE_v0.8.3.1_SURVIVOR_0.11.3_TEXT_POLISH1.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $out 'SHA256.txt') -Value $hash -Encoding ASCII
          Write-Host "Install package SHA256: $hash"

      - name: Upload clean install package
        uses: actions/upload-artifact@v4
        with:
          name: NCMM-0.8.3.1-Survivor-0.11.3-Text-Polish1
          path: artifact-output/**
          if-no-files-found: error
          retention-days: 30
