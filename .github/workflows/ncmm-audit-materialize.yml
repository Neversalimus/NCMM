name: Engineering audit fixes - materialize and Windows validation
on:
  push:
    branches: ['fix/engineering-audit-20261009']
    paths: ['.github/workflows/ncmm-audit-materialize.yml', '.audit/**']
permissions:
  contents: write
concurrency:
  group: ncmm-audit-fixes-materialize
  cancel-in-progress: false
jobs:
  apply-and-test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Keep byte-exact LF sources
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: fix/engineering-audit-20261009
          fetch-depth: 0
      - name: Materialize locally tested modifications with exact before-and-after hashes
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          assert subprocess.check_output(['git','branch','--show-current'], text=True).strip() == 'fix/engineering-audit-20261009'
          subprocess.check_call(['git','merge-base','--is-ancestor','4a83414a1bf4147860b0e3dd49a9aded0c5581d0','HEAD'])
          encoded = ''.join(pathlib.Path('.audit/delta.'+str(i)).read_text(encoding='ascii').strip() for i in range(3))
          compressed = base64.b85decode(encoded)
          assert hashlib.sha256(compressed).hexdigest() == 'cd350723d57929b74cec0ca6a683d812f86bd6c9b1174967e99953f7c6fa3b6e', 'Transport hash mismatch'
          entries = json.loads(lzma.decompress(compressed))
          prepared = []
          for entry in entries:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              if entry['old'] is None:
                  assert not path.exists(), 'New path already exists: '+str(path)
                  data = b''
              else:
                  data = path.read_bytes()
                  assert hashlib.sha256(data).hexdigest() == entry['old'], 'Baseline drift: '+str(path)
              lines = data.decode('utf-8').splitlines(keepends=True)
              for first,last,replacement in reversed(entry['edits']):
                  lines[first:last] = replacement.splitlines(keepends=True)
              data = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == entry['new'], 'Result mismatch: '+str(path)
              prepared.append((path,data))
          for path,data in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('Verified and applied',len(prepared),'source modifications; no main or release changes.')
      - name: Synchronize canonical snapshots and immutable package membership
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path -Check
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path -Check
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'Whitespace validation failed.'}
      - name: Persist complete sources on feature branch, never main
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item .audit -Recurse -Force
          Remove-Item .github/workflows/ncmm-audit-materialize.yml -Force
          git config user.name 'NCMM Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git commit -m 'Fix engineering audit findings and add executable regression coverage'
          if($LASTEXITCODE -ne 0){throw 'Source commit failed.'}
          git push origin HEAD:refs/heads/fix/engineering-audit-20261009
          if($LASTEXITCODE -ne 0){throw 'Feature branch push failed.'}
          $sha=(git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force evidence | Out-Null
          $sha | Set-Content evidence/tested-source.txt
      - uses: microsoft/setup-msbuild@v2
      - name: Windows runtime, source contracts, modules and destructive-failure fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Transcript -Path evidence/windows-validation.log
          try {
            ./ci/Test-EquipmentBodyMapUX.ps1 -RepositoryRoot $PWD.Path
            ./ci/Test-CanonicalPayloadSync.ps1 -RepositoryRoot $PWD.Path
            ./ci/Build-Runtime.ps1 -RepositoryRoot $PWD.Path -OutputRoot (Join-Path $PWD 'dist/runtime')
          } finally { Stop-Transcript }
      - name: Save evidence and patch for this exact source commit
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/checked-out-sha.txt
          git status --short | Set-Content evidence/worktree-status.txt
          git archive HEAD -o evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NCMM-engineering-fixes-Windows-evidence
          path: evidence/**
          retention-days: 14
          if-no-files-found: error
