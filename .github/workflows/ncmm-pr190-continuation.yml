name: Prepare PR190 continuation
on:
  push:
    branches: [audit/full-system-20261009]
    paths: [.github/workflows/ncmm-pr190-continuation.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef7a4699e49b0974e044ee12b1e776f7cc2fd3eb
      - name: Apply reviewed source changes to exact PR head
        shell: python
        run: |
          import base64,zlib,subprocess
          from pathlib import Path
          expected='ef7a4699e49b0974e044ee12b1e776f7cc2fd3eb'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected
          encoded=''
          # The encoded patch has its own zlib checksum; fail before touching files on corruption.
          patch=zlib.decompress(base64.b64decode(encoded.replace('WiexnbnbK','WiexnbK'),validate=True))
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          p=Path('payload/SURVIVOR_0911_0915_v8.7.6.8.ps1')
          t=p.read_text(encoding='utf-8-sig')
          def once(old,new):
            global t
            assert t.count(old)==1,(old,t.count(old))
            t=t.replace(old,new)
          once('Apply-SurvivorXpBalance0140\nApply-SurvivorDimensionalPouch0150\n','Apply-SurvivorXpBalance0140\n')
          once('# No source writer may follow this final Host boundary.\nApply-NcmmBallisticHost082CanonicalSync\nAssert-SurvivorXpBalanceHost0140\n','# No Host source writer may follow this final Host boundary.\nApply-NcmmBallisticHost082CanonicalSync\nAssert-SurvivorXpBalanceHost0140\n# Data-only emission validates the final Host, never the intermediate legacy snapshot.\nApply-SurvivorDimensionalPouch0150\n')
          prefix="Write-NcmmCanonicalPayloadFile 'runtime\\NCMMRuntimeIO.cs' "
          line=next(x for x in t.splitlines() if x.startswith(prefix))
          once(line,line+"\nWrite-NcmmCanonicalPayloadFile 'runtime\\NCMMRuntime.manifest' '"+base64.b64encode(Path('runtime/NCMMRuntime.manifest').read_bytes()).decode()+"'")
          once('    & $csc /nologo /target:winexe /optimize+ /platform:x64 `',"    $runtimeManifest = Join-Path $RepoRoot 'runtime\\NCMMRuntime.manifest'\n    if(-not(Test-Path $runtimeManifest -PathType Leaf)){throw 'NCMM runtime manifest missing.'}\n    & $csc /nologo /win32manifest:$runtimeManifest /target:winexe /optimize+ /platform:x64 `")
          p.write_text(t,encoding='utf-8-sig',newline='\n')
      - name: Regenerate canonical payload and integrity, then test guards
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path -Check
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path -Check
          ./ci/Test-CanonicalPayloadSync.ps1 -RepositoryRoot $PWD.Path
          ./ci/Test-Infrastructure083.ps1 -PackageRoot $PWD.Path
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'Whitespace guard failed'}
      - name: Save candidate without advancing PR or main
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changed.txt
          if grep -E '^(.github/|feed/)' /tmp/changed.txt; then echo 'Unexpected release/workflow mutation'; exit 1; fi
          git config user.name 'NCMM Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/Build-Runtime.ps1 ci/Sync-CanonicalPayload.ps1 ci/Test-AuditIO.ps1 ci/Test-CanonicalPayloadSync.ps1 ci/Test-InstallationMatrix.ps1 ci/Test-SurvivorPayloadContracts.ps1 compat/package-files.txt compat/package.integrity.json payload/SURVIVOR_0911_0915_v8.7.6.8.ps1 runtime/NCMMRuntimeIO.cs runtime/NCMMRuntime.manifest
          git commit -m 'Fix post-canonical persistent data emission and enable long paths in runtime executables'
          git push origin HEAD:refs/heads/audit/pr190-continuation-ready
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git show --stat > evidence/changes.txt
          git archive --format=zip HEAD -o evidence/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NCMM-PR190-continuation-source
          path: evidence/*
          if-no-files-found: error
          retention-days: 7
