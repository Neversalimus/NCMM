name: NCMM 0546 retirement maintenance
on:
  push:
    branches: ['maintenance/retire-0546-20261010']
    paths: ['.github/workflows/ncmm-retire-0546-maintenance.yml']
permissions:
  contents: write
concurrency:
  group: ncmm-retire-0546-maintenance
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  qualify:
    if: github.ref == 'refs/heads/maintenance/retire-0546-20261010'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/retire-0546-20261010
          fetch-depth: 0
          path: ncmmrepo
      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: 3f7fb352bf492ba521bd9408a0c9f6ce239e8d83
          path: upstream
          sparse-checkout: |
            src
            msvc-full-features
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Apply reviewed patch without overwriting concurrent main changes
        working-directory: ncmmrepo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, subprocess
          encoded = '''
          '''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '41e195bb39a683105da66786a0a0ed7f022850a0bc893d79fc36a25c2008e0a7', 'Patch transport mismatch'
          temporary = pathlib.Path('../retirement.patch')
          temporary.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(temporary)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(temporary)], check=True)
          retired = json.loads(pathlib.Path('ci/retired-hosts.json').read_text())['retired'][0]
          removals = {
              '.github/workflows/ncmm-ebm-test-installer.yml': 'a2555ceb1cee242da8cbb66fd97923ea5e10faee',
              'ci/ebm-test/Install_EBM_Test.ps1': '4c8e08732898c1a156628a6965ec24c6a3d119ee',
              'ci/ebm-test/README_RU.txt': '9cc666a5bb3e2f790f4aeec80e152db1c992dd0f',
              'ci/ebm-test/Restore_EBM_Test.ps1': '2241e1f5d2917cc9efac1b6896292fadf8634ced',
              'compat/feed/commits/' + retired['commit'] + '.json': 'ffc1fc310e0c44b97935a7de573efaadc845be3c'
          }
          for path, expected in removals.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
              assert actual == expected, 'Concurrent change in deleted path: ' + path
              pathlib.Path(path).unlink()
          pathlib.Path('ci/ebm-test').rmdir()
          payload = pathlib.Path('payload/SURVIVOR_0911_0915_v8.7.6.8.ps1')
          text = payload.read_text(encoding='utf-8-sig')
          defaults, separator, rest = text.partition('$ErrorActionPreference')
          assert separator
          for before, after in ((retired['commit'], '3f7fb352bf492ba521bd9408a0c9f6ce239e8d83'), (retired['tag'], 'cdda-experimental-2026-10-01-1040'), ('cdda_experimental_' + retired['tag'].removeprefix('cdda-experimental-').replace('-', '_'), 'cdda_experimental_2026_10_01_1040'), ('cdda_' + retired['tag'].split('-')[-1], 'cdda_1040')):
              assert defaults.count(before) == 1, before
              defaults = defaults.replace(before, after)
          text = defaults + separator + rest
          anchor = "Write-NcmmCanonicalPayloadFile 'ci\\toolchain.lock.json'"
          assert text.count(anchor) == 1
          additions = ''
          for name in ('host_support_policy.py', 'retired-hosts.json', 'test_host_support_policy.py'):
              content = pathlib.Path('ci', name).read_bytes().replace(b'\r\n', b'\n')
              additions += "Write-NcmmCanonicalPayloadFile 'ci\\" + name + "' '" + base64.b64encode(content).decode() + "'\n"
          text = text.replace(anchor, additions + anchor)
          payload.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
          subprocess.run(['python', 'ci/host_support_policy.py', 'prune-feed', 'feed/index.json'], check=True)
          pathlib.Path('.github/workflows/ncmm-retire-0546-maintenance.yml').unlink()
          PY
      - name: Synchronize and validate canonical package under Windows PowerShell
        working-directory: ncmmrepo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path -Check
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path -Check
          ./ci/Test-CanonicalPayloadSync.ps1 -RepositoryRoot $PWD.Path
          ./ci/Test-Infrastructure083.ps1 -PackageRoot $PWD.Path
          python ci/test_host_support_policy.py --source-root ../upstream -v
          if($LASTEXITCODE -ne 0){throw 'Host support policy tests failed'}
          $fixtures=Join-Path $env:RUNNER_TEMP 'retirement-fixtures'
          New-Item -ItemType Directory -Force (Join-Path $fixtures '1040/src') | Out-Null
          Copy-Item ../upstream/src/newcharacter.cpp,../upstream/src/player_difficulty.h (Join-Path $fixtures '1040/src')
          ./ci/Test-LegacyCharacterPoints.ps1 -RepositoryRoot $PWD.Path -FixtureRoot $fixtures
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'Patch whitespace check failed'}
      - name: Commit only qualified retirement changes to maintenance branch
        working-directory: ncmmrepo
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Retire CDDA 0546, pin verified 1040 baseline and prevent retired Host publication'
          git push origin HEAD:refs/heads/maintenance/retire-0546-20261010
      - name: Preserve exact source and patch evidence
        if: always()
        working-directory: ncmmrepo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          git rev-parse HEAD > ../evidence/head.txt
          git status --short > ../evidence/status.txt
          git diff --binary > ../evidence/worktree.patch
          git diff origin/main --stat > ../evidence/change-stat.txt
          git archive HEAD -o ../evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NCMM-0546-retirement-qualified
          path: evidence/*
          retention-days: 3
          if-no-files-found: error
