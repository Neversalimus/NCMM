name: NCMM 0546 retirement maintenance
on:
  push:
    branches: ['maintenance/retire-0546-20261010']
    paths: ['.github/workflows/ncmm-retire-0546-maintenance.yml']
permissions:
  contents: read
concurrency:
  group: ncmm-retire-0546-maintenance
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect retirement surfaces and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git grep -n -I -e 0546 -e 2026-09-23 -- . ':!payload/*' ':!.github/workflows/ncmm-retire-0546-maintenance.yml' > evidence/0546-references.txt || test "$?" = 1
          cat evidence/0546-references.txt
          git grep -n -I -e inventory_throwing_filter -e Sync-CanonicalPayload -e Regenerate-PackageIntegrity -- ci host_patch > evidence/patch-surfaces.txt || test "$?" = 1
          git archive HEAD -o evidence/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NCMM-0546-retirement-source
          path: evidence/*
          retention-days: 3
          if-no-files-found: error
