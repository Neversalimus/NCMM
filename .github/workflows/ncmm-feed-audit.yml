name: NCMM Feed Integrity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'feed/**'
      - 'ci/Test-VersionConsistency.ps1'
      - 'ci/Test-PatchRevisionPortability.ps1'
      - 'payload/SURVIVOR_0911_0915_v8.7.6.8.ps1'
      - '.github/workflows/ncmm-feed-audit.yml'

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit-feed:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout NCMM repository
        uses: actions/checkout@v4

      - name: Validate repository text encoding
        shell: pwsh
        run: |
          ./ci/Test-TextEncoding.ps1 -RepoRoot "$env:GITHUB_WORKSPACE"

      - name: Validate patch revision portability
        shell: pwsh
        run: |
          ./ci/Test-PatchRevisionPortability.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE"

      - name: Validate NCMM version consistency
        shell: pwsh
        run: |
          ./ci/Test-VersionConsistency.ps1 -RepositoryRoot "$env:GITHUB_WORKSPACE" -LegacyFeedVersion '0.7.1'

      - name: Feed auditor self-test
        shell: pwsh
        run: |
          ./ci/Test-FeedIntegrity.ps1 -SelfTest

      - name: Audit published certified-host feed
        shell: pwsh
        run: |
          $CurrentSourceVersion = '0.8.0'
          $LegacyFeedVersion = '0.7.1'
          $currentRevision = (./ci/Get-PatchRevision.ps1 -RepositoryRoot .).Trim()
          $feed = Get-Content ./feed/index.json -Raw | ConvertFrom-Json
          $feedVersion = [string]$feed.runtime_version

          if ([String]::Equals($feedVersion,$CurrentSourceVersion,[StringComparison]::OrdinalIgnoreCase)) {
            $expectedRevision = $currentRevision
          } elseif ([String]::Equals($feedVersion,$LegacyFeedVersion,[StringComparison]::OrdinalIgnoreCase)) {
            $expectedRevision = [string]$feed.patch_revision
            Write-Host "Auditing transactional legacy feed $feedVersion while source stack is $CurrentSourceVersion." -ForegroundColor Yellow
          } else {
            throw "Unexpected feed runtime version: $feedVersion"
          }

          ./ci/Test-FeedIntegrity.ps1 `
            -FeedPath ./feed/index.json `
            -RejectedPath ./feed/rejected.json `
            -ExpectedRuntimeVersion $feedVersion `
            -ExpectedPatchRevision $expectedRevision `
            -Repository '${{ github.repository }}' `
            -Online
