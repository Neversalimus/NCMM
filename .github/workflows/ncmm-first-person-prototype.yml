name: First Person View - experimental prototype
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ['experiments/FirstPersonView/**', 'experiments/graphics_bridge/**', 'runtime/NCMMSetupCore.cs', 'runtime/NCMMBootstrap.cs', 'runtime/NCMMRuntimeIO.cs', 'runtime/NCMMSetupDiagnostics.cs', 'runtime/NCMMSetup.cs', '.github/workflows/ncmm-first-person-prototype.yml']
  workflow_dispatch:
    inputs:
      qualification:
        description: 'Run quick checks, one integration checkpoint, or final qualification'
        type: choice
        default: quick
        options: [quick, integration, full]
permissions:
  contents: read
  actions: read
concurrency:
  group: ncmm-first-person-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  module:
    name: Renderer and module - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure isolated module
        run: cmake -S experiments/FirstPersonView -B fp-build -DCMAKE_BUILD_TYPE=Release -DFIRST_PERSON_BUILD_BENCHMARK=ON
      - name: Build prototype and contract tests
        run: cmake --build fp-build --config Release
      - name: Renderer, occlusion, fog, ABI and toggle lifecycle
        run: ctest --test-dir fp-build -C Release --output-on-failure
      - name: Record renderer timing and work counters (no FPS threshold)
        run: cmake --build fp-build --config Release --target first_person_measure
      - name: Configure focused cache and facade sanitizers
        if: runner.os == 'Linux'
        run: cmake -S experiments/FirstPersonView -B fp-cache-sanitize -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFIRST_PERSON_SANITIZE=ON
      - name: Build focused cache and facade sanitizers
        if: runner.os == 'Linux'
        run: cmake --build fp-cache-sanitize --parallel 2 --target first_person_multilevel_policy_tests first_person_multilevel_cache_tests first_person_multilevel_gpu_cache_tests first_person_facade_continuity_tests
      - name: ASan and UBSan sparse coordinates, face masks and facade continuity
        if: runner.os == 'Linux'
        run: ctest --test-dir fp-cache-sanitize -R "^first_person_(multilevel_(policy|cache|gpu_cache)|facade_continuity)$" --output-on-failure
      - name: Configure sanitizer coverage
        if: runner.os == 'Linux' && (inputs.qualification == 'full' || contains(github.event.pull_request.body, format('<!-- fp-qa:full@{0} -->', github.event.pull_request.head.sha)))
        run: cmake -S experiments/FirstPersonView -B fp-sanitize -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFIRST_PERSON_SANITIZE=ON
      - name: Build sanitizer geometry and shared-module tests
        if: runner.os == 'Linux' && (inputs.qualification == 'full' || contains(github.event.pull_request.body, format('<!-- fp-qa:full@{0} -->', github.event.pull_request.head.sha)))
        run: cmake --build fp-sanitize --parallel 2 --target first_person_camera_motion_tests first_person_optimization_tests first_person_hybrid_module_tests first_person_creature_semantics_tests first_person_creature_mesh_tests first_person_creature_appearance_tests first_person_creature_animation_tests first_person_creature_lod_tests first_person_creature_cache_tests first_person_creature_render_tests first_person_creature_module_tests first_person_gpu_contract_tests first_person_gpu_geometry_tests first_person_gpu_module_tests first_person_multilevel_policy_tests first_person_multilevel_cache_tests first_person_multilevel_render_tests first_person_multilevel_module_tests first_person_multilevel_gpu_cache_tests
      - name: ASan and UBSan camera, volume and DLL lifecycle coverage
        if: runner.os == 'Linux' && (inputs.qualification == 'full' || contains(github.event.pull_request.body, format('<!-- fp-qa:full@{0} -->', github.event.pull_request.head.sha)))
        run: ctest --test-dir fp-sanitize -R "camera_motion|optimization|hybrid_module|creature_|gpu_|multilevel_" --output-on-failure
      - name: Atomic source-transform negative tests
        run: python -m unittest discover -s experiments/graphics_bridge -p test_apply_graphics_bridge.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: first-person-module-${{ matrix.os }}
          path: |
            fp-build/Release/ncmm_mod.dll
            fp-build/ncmm_mod.so
            experiments/FirstPersonView/mod.json
            fp-build/first-person-benchmark.json
          retention-days: 7
  host:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.qualification != 'quick') ||
      contains(github.event.pull_request.body, format('<!-- fp-qa:integration@{0} -->', github.event.pull_request.head.sha)) ||
      contains(github.event.pull_request.body, format('<!-- fp-qa:full@{0} -->', github.event.pull_request.head.sha))
    needs: module
    name: Experimental MSVC Host - ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: '1040'
            source: 3f7fb352bf492ba521bd9408a0c9f6ce239e8d83
            tag: cdda-experimental-2026-10-01-1040
          - build: '1807'
            source: 074aa98bd5be3de4c35f154082db32a0e63bb0f1
            tag: cdda-experimental-2026-10-06-1807
    runs-on: windows-2022
    timeout-minutes: 270
    env:
      FP_FULL_QUALIFICATION: ${{ inputs.qualification == 'full' || contains(github.event.pull_request.body, format('<!-- fp-qa:full@{0} -->', github.event.pull_request.head.sha)) }}
      GH_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: 'true'
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/upstream/.github/vcpkg_triplets
      BACKTRACE: '1'
      CDDA_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: ncmmrepo
          # Packaging recovery uses the exact runtime source already compiled in run 38909436998.
          ref: 4de72e5f3cf161e0ce49b8f6abfca54c699617a5
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ matrix.source }}
          path: upstream
          persist-credentials: false
      - name: Prepare canonical NCMM plus optional graphics bridge
        shell: powershell
        run: ./ncmmrepo/experiments/FirstPersonView/Prepare-FirstPersonHost.ps1 -SourceRoot upstream
      - uses: microsoft/setup-msbuild@v2
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: f6672d8e480ccdecddfad3fd1b838ba369ffe6cd
      - name: Integrate pinned vcpkg
        shell: powershell
        run: vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: gettext make
      - uses: actions/cache@v4
        with:
          path: upstream/msvc-full-features/vcpkg_installed
          key: ncmm-vcpkg-${{ runner.os }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd-${{ hashFiles('upstream/msvc-full-features/vcpkg.json', 'upstream/.github/vcpkg_triplets/x64-windows-static.cmake') }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - name: Configure the canonical compiler cache wrapper
        shell: powershell
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'ncmm-fp-sccache'
          New-Item -ItemType Directory -Force $dir | Out-Null
          @'
          @echo off
          setlocal
          sccache.exe cl.exe %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content (Join-Path $dir 'cl.bat') -Encoding Ascii
          "NCMM_SCCACHE_WRAPPER_DIR=$dir" >> $env:GITHUB_ENV
          $props='upstream/msvc-full-features/Cataclysm-common.props'
          $text=[IO.File]::ReadAllText((Join-Path $PWD $props))
          $parallel='<MultiProcessorCompilation>true</MultiProcessorCompilation>'
          $debug='<DebugInformationFormat>ProgramDatabase</DebugInformationFormat>'
          if(!$text.Contains($parallel) -or !$text.Contains($debug)){throw 'Canonical compiler-cache anchors changed.'}
          $text=$text.Replace($parallel,'<MultiProcessorCompilation>false</MultiProcessorCompilation>').Replace($debug,'<DebugInformationFormat>OldStyle</DebugInformationFormat>')
          [IO.File]::WriteAllText((Join-Path $PWD $props),$text,(New-Object Text.UTF8Encoding($false)))
      - uses: actions/cache/restore@v4
        id: engine_cache
        with:
          path: |
            upstream/cataclysm-tiles.exe
            upstream/first-person-host.sha256
          key: ncmm-fp-host-${{ matrix.build }}-v1-${{ runner.os }}-${{ hashFiles('upstream/src/**', 'upstream/msvc-full-features/**', 'upstream/first-person-source.json', 'upstream/.github/vcpkg_triplets/**') }}
      - name: Compile actual experimental engine (no certification/publication)
        if: steps.engine_cache.outputs.cache-hit != 'true'
        shell: powershell
        working-directory: upstream
        run: |
          & msbuild -m -p:Configuration=Release -p:Platform=x64 -p:CLToolExe=cl.bat "-p:CLToolPath=$env:NCMM_SCCACHE_WRAPPER_DIR" -p:TrackFileAccess=false -p:UseMultiToolTask=true -target:Cataclysm-vcpkg-static msvc-full-features/Cataclysm-vcpkg-static.sln
          if($LASTEXITCODE -ne 0){throw 'Experimental MSVC Host build failed.'}
          if(!(Test-Path cataclysm-tiles.exe)){throw 'Experimental engine binary missing.'}
          (Get-FileHash cataclysm-tiles.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content first-person-host.sha256 -Encoding Ascii
      - name: Record effective compiler cache coverage
        if: always()
        shell: powershell
        run: |
          if(Get-Command sccache.exe -ErrorAction SilentlyContinue) {
            $raw=& sccache.exe --show-stats --stats-format=json
            if($LASTEXITCODE -eq 0) {
              $raw | Set-Content compiler-cache.json -Encoding UTF8
              $stats=($raw | ConvertFrom-Json).stats
              $cacheable=[int]$stats.requests_executed
              $requests=[int]$stats.compile_requests
              Write-Host "Cacheable requests: $cacheable / $requests; bypass reasons are retained in compiler-cache.json."
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-person-compiler-cache-${{ matrix.build }}
          path: compiler-cache.json
          retention-days: 7
      - name: Verify compiled or cached engine identity
        shell: powershell
        working-directory: upstream
        run: |
          $expected=(Get-Content first-person-host.sha256 -Raw).Trim()
          if($expected -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash cataclysm-tiles.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw 'Experimental Host cache identity mismatch.'}
      - uses: actions/cache/save@v4
        if: steps.engine_cache.outputs.cache-hit != 'true'
        with:
          path: |
            upstream/cataclysm-tiles.exe
            upstream/first-person-host.sha256
          key: ${{ steps.engine_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: first-person-experimental-host-${{ matrix.build }}
          path: |
            upstream/cataclysm-tiles.exe
            upstream/first-person-source.json
            upstream/LICENSE.txt
            ncmmrepo/THIRD_PARTY_NOTICES.txt
          retention-days: 7
      - name: Download SHA256-verified official Windows ${{ matrix.build }} graphics and sounds packages
        id: game
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tag='${{ matrix.tag }}'
          $release=(& gh api "repos/CleverRaven/Cataclysm-DDA/releases/tags/$tag") | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Official release lookup failed.'}
          $download=Join-Path $env:RUNNER_TEMP 'fp-download'
          New-Item -ItemType Directory -Force $download | Out-Null
          $dateBuild=$tag.Substring('cdda-experimental-'.Length)
          foreach($variant in @(@{name='graphics';output='root'},@{name='graphics-and-sounds';output='sound_root'})) {
            $name="cdda-windows-with-$($variant.name)-x64-$dateBuild.zip"
            $matchingAssets=@($release.assets | Where-Object {$_.name -eq $name})
            if($matchingAssets.Count -ne 1 -or [string]$matchingAssets[0].digest -notmatch '^sha256:[0-9a-f]{64}$'){throw "Missing official archive identity: $name"}
            $asset=$matchingAssets[0]
            $extract=Join-Path $env:RUNNER_TEMP ("fp-game-"+$variant.name)
            New-Item -ItemType Directory -Force $extract | Out-Null
            & gh release download $tag -R CleverRaven/Cataclysm-DDA -p $name -D $download
            if($LASTEXITCODE -ne 0){throw "Official game download failed: $name"}
            $zip=Join-Path $download $name
            if(('sha256:'+(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()) -ne [string]$asset.digest){throw "Official archive digest mismatch: $name"}
            & tar.exe -xf $zip -C $extract
            if($LASTEXITCODE -ne 0){throw "Official game extraction failed: $name"}
            $exes=@(Get-ChildItem $extract -Filter cataclysm-tiles.exe -Recurse -File)
            if($exes.Count -ne 1){throw "Expected one official game executable: $name"}
            Write-Host "Verified $name; executable SHA256: $((Get-FileHash $exes[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            "$($variant.output)=$($exes[0].Directory.FullName)" >> $env:GITHUB_OUTPUT
          }
      - name: Acquire SHA256-verified exact 0.12 main baseline Host and DLL
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          New-Item -ItemType Directory -Force installer-result | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pins=@{
            '1040'=@{id=11922850055;sha='4aef0fe60cc0861db9b3ec067aeceabaf253bb06897628db486e59027b6d17ae';inner='a751fbe620ea94b2d1e6a28ca223b3b9313435c425feef02c9491dbfb92b8eba'}
            '1807'=@{id=11922805752;sha='392a562429339227eff2332c035ee98a30cabd2f28b2c989ed594c8b440780ba';inner='c63a15d7e231830ed1e549deadcb97d69d67586ce3ba49e81e437cdc87bb2596'}
          }
          $pin=$pins['${{ matrix.build }}']
          $outer=Join-Path $env:RUNNER_TEMP 'fp012-baseline-artifact.zip'
          Invoke-WebRequest -UseBasicParsing -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -Uri ("https://api.github.com/repos/Neversalimus/NCMM/actions/artifacts/"+$pin.id+'/zip') -OutFile $outer
          if((Get-FileHash $outer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha){throw 'Baseline artifact SHA256 mismatch.'}
          $inner=Join-Path $env:RUNNER_TEMP 'fp012-baseline-installer.zip'
          $zip=[IO.Compression.ZipFile]::OpenRead($outer)
          try {
            $entry=@($zip.Entries | Where-Object {$_.FullName.Replace('\','/').EndsWith('NCMM_FirstPersonView_0.12.0_TEST_${{ matrix.build }}_Windows_x64.zip')})
            if($entry.Count -ne 1){throw 'Baseline installer is missing or ambiguous.'}
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry[0],$inner,$true)
          } finally {$zip.Dispose()}
          if((Get-FileHash $inner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.inner){throw 'Baseline installer SHA256 mismatch.'}
          $base=Join-Path $env:RUNNER_TEMP 'fp012-baseline'
          Expand-Archive -LiteralPath $inner -DestinationPath $base
          $bundles=@(Get-ChildItem $base -Filter first-person-bundle.json -Recurse -File)
          if($bundles.Count -ne 1){throw 'Baseline bundle missing.'}
          $payload=$bundles[0].Directory.FullName
          $bundle=Get-Content $bundles[0].FullName -Raw | ConvertFrom-Json
          if($bundle.source_commit -ne '${{ matrix.source }}' -or $bundle.ncmm_source_commit -ne '74315d034bc28f96133f4af9a71ed44a0d077f7e'){throw 'Baseline source identity differs from the qualified 0.12 candidate.'}
          foreach($file in $bundle.files.PSObject.Properties){
            if((Get-FileHash (Join-Path $payload $file.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value){throw "Baseline payload mismatch: $($file.Name)"}
          }
          "FP012_BASELINE_PAYLOAD=$payload" >> $env:GITHUB_ENV
          [ordered]@{baseline_main='c5a0a0a5e12991df06ba000f80dd359f274b7f50';qualified_head='9c3c69397bbb5ae9d3ec16f8ef21732e15e08b34';qualified_merge=$bundle.ncmm_source_commit;engine_source=$bundle.source_commit;artifact_sha256=$pin.sha;installer_sha256=$pin.inner;host_sha256=$bundle.host_sha256;module_sha256=$bundle.files.'code_mods/FirstPersonView/ncmm_mod.dll';host_and_module_replaced=$true} | ConvertTo-Json | Set-Content installer-result/first-person-baseline-provenance.json -Encoding UTF8
      - name: Build preview installer and verify transactions with Windows long paths disabled
        id: installer_gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $policy='HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $previousPolicy=(Get-ItemProperty $policy -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          New-ItemProperty $policy -Name LongPathsEnabled -Value 0 -PropertyType DWord -Force | Out-Null
          try {
            $env:NCMM_FP_LONG_PATH_POLICY_TEST='1'
            ./ncmmrepo/experiments/FirstPersonView/Build-FirstPersonInstaller.ps1 -RepositoryRoot (Join-Path $PWD 'ncmmrepo') -HostRoot (Join-Path $PWD 'upstream') -GameRoot '${{ steps.game.outputs.root }}' -AdditionalGameRoots '${{ steps.game.outputs.sound_root }}' -OutputRoot (Join-Path $PWD 'installer-result')
            ./ncmmrepo/ci/Test-AuditIO.ps1 -RepositoryRoot (Join-Path $PWD 'ncmmrepo')
          } finally {
            Remove-Item Env:NCMM_FP_LONG_PATH_POLICY_TEST -ErrorAction SilentlyContinue
            if($null -eq $previousPolicy){Remove-ItemProperty $policy -Name LongPathsEnabled -ErrorAction SilentlyContinue}
            else {Set-ItemProperty $policy -Name LongPathsEnabled -Value $previousPolicy}
          }
      - name: Launch both official package installations twice through the actual preview bootstrap
        timeout-minutes: 15
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($root in @('${{ steps.game.outputs.root }}','${{ steps.game.outputs.sound_root }}')) {
            foreach($attempt in @(1,2)) {
              $p=Start-Process (Join-Path $root 'cataclysm-tiles.exe') -ArgumentList '--ncmm-runtime-smoke' -WorkingDirectory $root -PassThru
              if(-not $p.WaitForExit(180000)){& taskkill.exe /pid $p.Id /t /f;throw 'Runtime launch deadline exceeded.'}
              $p.Refresh()
              if($p.ExitCode -ne 0){throw "Runtime launch failed: $($p.ExitCode)"}
              $state=Get-Content (Join-Path $root 'ncmm/modules.state.json') -Raw | ConvertFrom-Json
              $fp=@($state.modules | Where-Object {$_.id -eq 'first_person_view'})
              if($fp.Count -ne 1 -or $fp[0].state -ne 'loaded'){throw 'First Person View did not load in the real engine.'}
              if(!(Test-Path (Join-Path $root 'ncmm/boot.ready')) -or (Test-Path (Join-Path $root 'ncmm/boot.pending'))){throw 'Bootstrap lifecycle markers inconsistent.'}
            }
          }
      - name: Fast native multi-Z save-load gate before the full gallery
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='${{ steps.game.outputs.root }}'
          $env:NCMM_FP_SAVE_ONLY='1'
          try {
            foreach($attempt in @(1,2)) {
              ./ncmmrepo/experiments/FirstPersonView/tests/Reset-SmokeWorld.ps1 -GameRoot $root
              $p=Start-Process (Join-Path $root 'cataclysm-tiles.exe') -ArgumentList '--ncmm-gameplay-smoke --seed ncmm-save-012' -WorkingDirectory $root -PassThru
              if(-not $p.WaitForExit(300000)){& taskkill.exe /pid $p.Id /t /f;throw 'Native save-load gate deadline exceeded.'}
              $p.Refresh()
              $smoke=Get-Content (Join-Path $root 'ncmm/first-person-smoke.json') -Raw | ConvertFrom-Json
              if($p.ExitCode -ne 0 -or $smoke.success -ne $true){throw "Native save-load gate failed: $($smoke.reason), exit $($p.ExitCode)"}
              $save=Get-Content (Join-Path $root 'ncmm/first-person-multilevel-save-after.json') -Raw | ConvertFrom-Json
              if($save.success -ne $true -or @($save.levels).Count -ne 3){throw 'Native save-load gate is incomplete.'}
              Copy-Item (Join-Path $root 'ncmm/first-person-multilevel-save-after.json') 'installer-result/first-person-multilevel-save-fast-gate.json'
              Copy-Item (Join-Path $root 'ncmm/first-person-multilevel-save-after.json') ("installer-result/first-person-multilevel-save-fast-gate-"+$attempt+'.json')
            }
          } finally {Remove-Item Env:\NCMM_FP_SAVE_ONLY -ErrorAction SilentlyContinue}
      - uses: actions/checkout@v4
        with:
          repository: Neversalimus/CDDA-Mods
          ref: 59123092c33244d516fa9d5ca69eaafb8d487f37
          path: udp-resources
          persist-credentials: false
          sparse-checkout: mods/undeadpeople/content
      - name: Automated native gameplay, CPU/GPU profiling and actual UDP Hybrid v3
        timeout-minutes: 55
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='${{ steps.game.outputs.root }}'
          $duration=60
          if($env:FP_FULL_QUALIFICATION -eq 'true' -and '${{ matrix.build }}' -eq '1807'){$duration=1800}
          $output=Join-Path $env:RUNNER_TEMP 'fp-gameplay-audit'
          ./ncmmrepo/experiments/FirstPersonView/Run-FirstPersonBenchmark.ps1 -GameRoot $root -BundleRoot (Join-Path $PWD 'installer-result/_first_person_installer') -OutputRoot $output -TilesetRoot (Join-Path $PWD 'udp-resources/mods/undeadpeople/content') -SoakSeconds $duration
          $evidence=Join-Path $output 'evidence'
          $audit=Get-Content (Join-Path $evidence 'first-person-gameplay-audit.json') -Raw | ConvertFrom-Json
          if(@($audit.tilesets).Count -ne 2){throw 'Actual UDP Hybrid v3 evidence is incomplete.'}
          python ncmmrepo/experiments/FirstPersonView/tests/verify_gameplay_audit.py --root $evidence --minimum-soak-seconds $duration --output installer-result/first-person-gameplay-verified.json
          if($LASTEXITCODE -ne 0){throw 'Native gameplay evidence verification failed.'}
          Copy-Item (Join-Path $output 'benchmark-provenance.json') 'installer-result/first-person-gameplay-provenance.json'
          Copy-Item (Join-Path $evidence 'first-person-gameplay-audit.json') 'installer-result/first-person-gameplay-audit.json'
          Copy-Item (Join-Path $evidence 'first-person-multilevel-save-after.json') 'installer-result/first-person-gameplay-save-load.json'
          Copy-Item (Join-Path $evidence 'udp-asset-sha256.json') 'installer-result/first-person-gameplay-udp-assets.json'
          Get-ChildItem $evidence -Filter 'first-person-audit-*.bmp' | Copy-Item -Destination installer-result
      - name: Focused one-creature and smoke frame-phase reproduction
        if: ${{ always() && !cancelled() && steps.installer_gate.outcome == 'success' }}
        timeout-minutes: 12
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'fp-focused-gpu'
          ./ncmmrepo/experiments/FirstPersonView/Run-FirstPersonBenchmark.ps1 -GameRoot '${{ steps.game.outputs.root }}' -BundleRoot (Join-Path $PWD 'installer-result/_first_person_installer') -OutputRoot $output -FocusedGpuBenchmark
          $evidence=Join-Path $output 'evidence'
          python ncmmrepo/experiments/FirstPersonView/tests/verify_gpu_profile.py --input (Join-Path $evidence 'first-person-gpu-benchmark.json') --output installer-result/first-person-gpu-focused-verified.json
          if($LASTEXITCODE -ne 0){throw 'Focused native frame phase verification failed.'}
          Copy-Item (Join-Path $evidence 'first-person-gpu-benchmark.json') installer-result/first-person-gpu-focused-profile.json
          Copy-Item (Join-Path $output 'benchmark-provenance.json') installer-result/first-person-gpu-focused-provenance.json
          Get-ChildItem $evidence -Filter 'first-person-gpu-*.bmp' | ForEach-Object {Copy-Item $_.FullName (Join-Path installer-result ($_.Name.Replace('first-person-gpu-','first-person-gpu-focused-')))}
      - name: Native walking, camera easing and full-size UDP viewport
        if: ${{ always() && !cancelled() && steps.installer_gate.outcome == 'success' }}
        timeout-minutes: 20
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'fp-movement'
          ./ncmmrepo/experiments/FirstPersonView/Run-FirstPersonBenchmark.ps1 -GameRoot '${{ steps.game.outputs.root }}' -BundleRoot (Join-Path $PWD 'installer-result/_first_person_installer') -OutputRoot $output -TilesetRoot (Join-Path $PWD 'udp-resources/mods/undeadpeople/content') -MovementBenchmark
          $evidence=Join-Path $output 'evidence'
          Copy-Item (Join-Path $evidence 'first-person-movement-benchmark.json') installer-result/first-person-movement-benchmark.json
          Copy-Item (Join-Path $output 'benchmark-provenance.json') installer-result/first-person-movement-provenance.json
          Get-ChildItem $evidence -Filter 'first-person-movement-*.bmp' | Copy-Item -Destination installer-result
      - name: Actual SDL controls, appearance, geometry, RGB light, sky, weather and held items
        if: env.FP_FULL_QUALIFICATION == 'true'
        timeout-minutes: 120
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($variant in @(@{name='graphics';root='${{ steps.game.outputs.root }}'},@{name='sounds';root='${{ steps.game.outputs.sound_root }}'})) {
            $root=$variant.root
            Copy-Item ncmmrepo/experiments/FirstPersonView/tests/creature_appearance_fixture.json (Join-Path $root 'data/json/monsters/ncmm_appearance_qualification.json') -Force
            Copy-Item ncmmrepo/experiments/FirstPersonView/tests/multilevel_fixture.json (Join-Path $root 'data/json/furniture_and_terrain/ncmm_multilevel_qualification.json') -Force
            $env:NCMM_FP_APPEARANCE_SMOKE='1'
            $env:NCMM_FP_APPEARANCE_DEBUG_DIR=Join-Path $env:RUNNER_TEMP ("fp-appearance-"+'${{ matrix.build }}'+'-'+$variant.name)
            ./ncmmrepo/experiments/FirstPersonView/tests/Reset-SmokeWorld.ps1 -GameRoot $root
            $p=Start-Process (Join-Path $root 'cataclysm-tiles.exe') -ArgumentList '--ncmm-gameplay-smoke --seed ncmm-appearance-011' -WorkingDirectory $root -PassThru
            if(-not $p.WaitForExit(3000000)){& taskkill.exe /pid $p.Id /t /f;throw 'Gameplay deadline exceeded.'}
            $p.Refresh()
            if($p.ExitCode -ne 0){throw "Gameplay smoke failed: $($p.ExitCode)"}
            $result=Get-Content (Join-Path $root 'ncmm/first-person-smoke.json') -Raw | ConvertFrom-Json
            if($result.success -ne $true -or $result.sdl_frames -lt 70){throw 'First person SDL smoke is incomplete.'}
            Copy-Item (Join-Path $root 'ncmm/first-person-smoke.json') ("installer-result/first-person-smoke-"+$variant.name+'.json')
            Get-ChildItem (Join-Path $root 'ncmm') -Filter 'first-person-*.bmp' | ForEach-Object { Copy-Item $_.FullName (Join-Path 'installer-result' ($_.BaseName+'-'+$variant.name+'.bmp')) }
            Copy-Item (Join-Path $root 'ncmm/first-person-shapes-audit.json') ("installer-result/first-person-shapes-audit-"+$variant.name+'.json')
            foreach($name in @('first-person-creature-coverage','first-person-creature-gallery-procedural','first-person-creature-timing-procedural','first-person-creature-gallery-procedural-gpu','first-person-creature-timing-procedural-gpu','first-person-gpu-probe','first-person-gpu-room','first-person-gpu-benchmark','first-person-multilevel-after','first-person-multilevel-save-after')) {
              $path=Join-Path $root ("ncmm/$name.json")
              if(!(Test-Path $path)){throw "Missing creature evidence: $name"}
              Copy-Item $path ("installer-result/$name-"+$variant.name+'.json')
            }
            $timing=Get-Content (Join-Path $root 'ncmm/first-person-creature-timing-procedural.json') -Raw | ConvertFrom-Json
            if(@($timing.records).Count -ne 12 -or $timing.actual_cdda_sdl -ne $true){throw 'Creature benchmark matrix is incomplete.'}
            foreach($mode in @('after-cpu','after-gpu')) {
              $path=Join-Path $root ("ncmm/first-person-appearance-"+$mode+'.json')
              $appearance=Get-Content $path -Raw | ConvertFrom-Json
              if($appearance.actual_cdda_sdl -ne $true -or @($appearance.frames).Count -lt 880){throw "Appearance matrix incomplete: $mode"}
              Copy-Item $path ("installer-result/first-person-appearance-"+$mode+'-'+$variant.name+'.json')
            }
            New-Item -ItemType Directory -Force fp-evidence | Out-Null
            Copy-Item $env:NCMM_FP_APPEARANCE_DEBUG_DIR (Join-Path fp-evidence ('appearance-debug-'+$variant.name)) -Recurse -Force
            Remove-Item Env:NCMM_FP_APPEARANCE_DEBUG_DIR -ErrorAction SilentlyContinue

          }
      - name: Paired exact 0.12 Host and module world benchmark
        if: env.FP_FULL_QUALIFICATION == 'true'
        timeout-minutes: 120
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($variant in @(@{name='graphics';root='${{ steps.game.outputs.root }}'},@{name='sounds';root='${{ steps.game.outputs.sound_root }}'})) {
            $root=$variant.root
            $module=Join-Path $root 'code_mods/FirstPersonView'
            $backup=Join-Path $env:RUNNER_TEMP ('fp-module-current-'+$variant.name)
            New-Item -ItemType Directory -Force $backup | Out-Null
            Copy-Item (Join-Path $module 'ncmm_mod.dll') $backup
            Copy-Item (Join-Path $module 'mod.json') $backup
            $jsonBackup=Join-Path $backup 'json'
            New-Item -ItemType Directory -Force $jsonBackup | Out-Null
            Get-ChildItem (Join-Path $root 'ncmm') -Filter 'first-person-*.json' | Copy-Item -Destination $jsonBackup
            $afterImages=@(Get-ChildItem (Join-Path $root 'ncmm') -Filter 'first-person-*.bmp' -File)
            $baselineHost=Join-Path $root 'cataclysm-tiles.fp012-baseline.exe'
            try {
              Copy-Item (Join-Path $env:FP012_BASELINE_PAYLOAD 'host/cataclysm-tiles.ncmm.exe') $baselineHost
              Copy-Item (Join-Path $env:FP012_BASELINE_PAYLOAD 'code_mods/FirstPersonView/ncmm_mod.dll') (Join-Path $module 'ncmm_mod.dll') -Force
              Copy-Item (Join-Path $env:FP012_BASELINE_PAYLOAD 'code_mods/FirstPersonView/mod.json') (Join-Path $module 'mod.json') -Force
              $env:NCMM_FP_MULTILEVEL_BEFORE='1'
              $env:NCMM_FP_APPEARANCE_BEFORE='1'
              $env:NCMM_FP_APPEARANCE_SMOKE='1'
              ./ncmmrepo/experiments/FirstPersonView/tests/Reset-SmokeWorld.ps1 -GameRoot $root
              $p=Start-Process $baselineHost -ArgumentList '--ncmm-gameplay-smoke --seed ncmm-appearance-011' -WorkingDirectory $root -PassThru
              if(-not $p.WaitForExit(3000000)){& taskkill.exe /pid $p.Id /t /f;$null=$p.WaitForExit(10000);throw 'Paired 0.12 baseline deadline exceeded.'}
              $p.Refresh()
              if($p.ExitCode -ne 0){throw "Paired 0.12 baseline failed: $($p.ExitCode)"}
              foreach($name in @('first-person-multilevel-save-before','first-person-multilevel-before','first-person-appearance-before-cpu')){
                Copy-Item (Join-Path $root ("ncmm/$name.json")) ("installer-result/$name-"+$variant.name+'.json')
              }
              Copy-Item (Join-Path $root 'ncmm/first-person-smoke.json') ("installer-result/first-person-smoke-before-"+$variant.name+'.json')
              Copy-Item (Join-Path $root 'ncmm/first-person-gpu-benchmark.json') ("installer-result/first-person-gpu-benchmark-before-"+$variant.name+'.json')
              Get-ChildItem (Join-Path $root 'ncmm') -Filter 'first-person-*-before-*.bmp' | ForEach-Object {Copy-Item $_.FullName (Join-Path installer-result ($_.BaseName+'-'+$variant.name+'.bmp'))}
            } finally {
              foreach($name in @('NCMM_FP_MULTILEVEL_BEFORE','NCMM_FP_APPEARANCE_BEFORE','NCMM_FP_APPEARANCE_SMOKE')){Remove-Item ('Env:'+ $name) -ErrorAction SilentlyContinue}
              foreach($name in @('ncmm_mod.dll','mod.json')){Copy-Item (Join-Path $backup $name) (Join-Path $module $name) -Force}
              Get-ChildItem $jsonBackup -File | Copy-Item -Destination (Join-Path $root 'ncmm') -Force
              foreach($image in $afterImages){$saved=Join-Path installer-result ($image.BaseName+'-'+$variant.name+'.bmp');if(Test-Path $saved){Copy-Item $saved $image.FullName -Force}}
              Remove-Item $baselineHost -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image qualification tools
        shell: powershell
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Verify paired camera, pose, lighting, pixels and image provenance
        if: env.FP_FULL_QUALIFICATION == 'true'
        shell: powershell
        run: |
          foreach($variant in @(@{name='graphics';root='${{ steps.game.outputs.root }}'},@{name='sounds';root='${{ steps.game.outputs.sound_root }}'})) {
            python ncmmrepo/experiments/FirstPersonView/tests/verify_appearance.py --root (Join-Path $variant.root 'ncmm') --output ("installer-result/first-person-appearance-paired-"+$variant.name+'.json')
            if($LASTEXITCODE -ne 0){throw 'Paired appearance input/image verification failed.'}
            python ncmmrepo/experiments/FirstPersonView/tests/verify_multilevel.py --baseline-version 0.12 --root (Join-Path $variant.root 'ncmm') --output ("installer-result/first-person-multilevel-paired-"+$variant.name+'.json')
            if($LASTEXITCODE -ne 0){throw 'Paired multilevel input/image verification failed.'}
          }
      - name: Collect runtime evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force fp-evidence | Out-Null
          foreach($variant in @(@{name='graphics';root='${{ steps.game.outputs.root }}'},@{name='sounds';root='${{ steps.game.outputs.sound_root }}'})) {
            $root=$variant.root
            if($root -and (Test-Path (Join-Path $root 'ncmm'))){Copy-Item (Join-Path $root 'ncmm') (Join-Path fp-evidence $variant.name) -Recurse}
            $audit=Join-Path $env:RUNNER_TEMP 'fp-gameplay-audit/evidence'
            if($variant.name -eq 'graphics' -and (Test-Path $audit)){Copy-Item $audit (Join-Path fp-evidence 'gameplay-audit') -Recurse -Force}
            $movement=Join-Path $env:RUNNER_TEMP 'fp-movement/evidence'
            if($variant.name -eq 'graphics' -and (Test-Path $movement)){Copy-Item $movement (Join-Path fp-evidence 'movement') -Recurse -Force}
            $debug=Join-Path $env:RUNNER_TEMP ("fp-appearance-"+'${{ matrix.build }}'+'-'+$variant.name)
            if(Test-Path $debug){Copy-Item $debug (Join-Path fp-evidence ('appearance-debug-'+$variant.name)) -Recurse -Force}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-person-runtime-evidence-${{ matrix.build }}-graphics
          path: |
            fp-evidence/graphics/**
            fp-evidence/appearance-debug-graphics/**
            fp-evidence/gameplay-audit/**
            fp-evidence/movement/**
          compression-level: 9
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-person-runtime-evidence-${{ matrix.build }}-sounds
          path: |
            fp-evidence/sounds/**
            fp-evidence/appearance-debug-sounds/**
          compression-level: 9
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: first-person-installer-${{ matrix.build }}-Windows-x64
          path: |
            installer-result/NCMM_FirstPersonView_*_TEST_${{ matrix.build }}_Windows_x64.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: first-person-qualification-${{ matrix.build }}
          path: |
            installer-result/first-person-movement-*.json
            installer-result/first-person-movement-*.bmp
            installer-result/first-person-gameplay*.json
            installer-result/first-person-audit*.bmp
            installer-result/first-person-baseline-provenance.json
            installer-result/first-person-multilevel*.json
            installer-result/first-person-world*.bmp
            installer-result/first-person-smoke*.json
            installer-result/first-person-shapes-audit*.json
            installer-result/first-person-creature-*.json
            installer-result/first-person-gpu-*.json
            installer-result/first-person-gpu-focused-*.bmp
            installer-result/first-person-appearance-*.json
          if-no-files-found: error
          retention-days: 7
