name: First Person View - experimental prototype
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['experiments/FirstPersonView/**', 'experiments/graphics_bridge/**', 'host_patch/**', 'sdk/**', 'runtime/**', 'ci/fpv_qualification.py', 'ci/test_fpv_qualification.py', 'ci/fpv_changed_paths.cjs', 'ci/test_fpv_changed_paths.cjs', '.github/workflows/ncmm-first-person-prototype.yml', '.github/workflows/ncmm-fpv-linux-native.yml']
  workflow_dispatch:
    inputs:
      qualification:
        description: 'Run quick checks, one integration checkpoint, or final qualification'
        type: choice
        default: quick
        options: [quick, integration, full]
      terrain_pair:
        description: 'CI-only same-Host pre-71 terrain include ablation (seven alternating pairs)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ncmm-first-person-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  qualification_plan:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.plan.outputs.required }}
      selected: ${{ steps.plan.outputs.selected }}
      native: ${{ steps.plan.outputs.native }}
      full: ${{ steps.plan.outputs.full }}
      sufficient: ${{ steps.plan.outputs.sufficient }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a Native tier for the optional terrain ablation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.terrain_pair && inputs.qualification == 'quick' }}
        run: |
          echo 'Terrain ablation requires integration or full qualification.'
          exit 1
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let paths = [];
            if (context.payload.pull_request) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.payload.pull_request.number, per_page: 100
              });
              if (files.length >= 3000) throw new Error('Potentially truncated PR file list; qualification must fail closed.');
              paths = files.flatMap(f => f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);
            } else {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner, repo: context.repo.repo,
                basehead: `${context.payload.repository.default_branch}...${context.sha}`
              });
              const {completeChangedPaths} = require('./ci/fpv_changed_paths.cjs');
              paths = await completeChangedPaths(github, context.repo, comparison.data.merge_base_commit.sha, context.sha);
            }
            fs.writeFileSync('fpv-changes.json', JSON.stringify(paths));
      - name: Complete Git tree classification negative tests
        run: node --test ci/test_fpv_changed_paths.cjs
      - name: Qualification policy negative tests
        run: python -m unittest discover -s ci -p test_fpv_qualification.py -v
      - id: plan
        run: python ci/fpv_qualification.py --files fpv-changes.json
  module:
    needs: qualification_plan
    name: Renderer and module - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify shipping shader source identity before compilation
        run: python experiments/FirstPersonView/compile_gpu_shaders.py --verify --output experiments/graphics_bridge/ncmm_gpu_shader_bytes.hpp
      - name: Check release verifier syntax
        run: python -m py_compile experiments/FirstPersonView/tests/verify_horizon_release.py
      - name: Native paired sight comparison receipt negative tests
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_sight_comparison.py -v
      - name: Reject partial or double-counted controlled Native turn intervals
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_turn_attribution.py -v
      - name: Reject invalid first-frame phase accounting
        run: python -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_movement_phases.py -v
      - name: Reject stale sources, partial terrain pairs, fallback phases and changed captures
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_terrain_pair.py -v
      - name: Reject incomplete or mismatched packaged hardware evidence
        run: python -m unittest discover -s experiments/FirstPersonView/tests -p test_compare_movement_runs.py -v
      - name: Reject mismatched ordinary four-mode hardware comparisons
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_compare_fullsize_modes.py -v
      - name: Reject hidden native map flashes, CPU fallback and corrupt firing captures
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_fire_audit.py -v
      - name: Reject stale target identities, invented HP and hidden targets
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_target_audit.py -v
      - name: Reject incomplete or uncosted Native FPS controls evidence
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_fps_audit.py -v
      - name: Reject changed or partial private SDL graphics dependencies
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_native_sdl_bridge.py -v
      - name: Keep isolated Linux startup language and deferred values explicit
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_native_linux_configuration.py -v
      - name: Diagnostic environment isolation on PowerShell Core
        shell: pwsh
        run: |
          ./experiments/FirstPersonView/tests/Test-BenchmarkEnvironment.ps1
          ./experiments/FirstPersonView/tests/Test-BenchmarkEvidence.ps1
          ./experiments/FirstPersonView/tests/Test-BenchmarkPaths.ps1
          ./experiments/FirstPersonView/tests/Test-BenchmarkCapture.ps1
          ./experiments/FirstPersonView/tests/Test-BenchmarkDataCopy.ps1
          ./experiments/FirstPersonView/tests/Test-CompilerWrapper.ps1
          ./experiments/FirstPersonView/tests/Test-HeldPackage.ps1
          ./experiments/FirstPersonView/tests/Test-WorldPackage.ps1
      - name: Diagnostic environment isolation on Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./experiments/FirstPersonView/tests/Test-BenchmarkEnvironment.ps1
          ./experiments/FirstPersonView/tests/Test-BenchmarkEvidence.ps1
          ./experiments/FirstPersonView/tests/Test-BenchmarkPaths.ps1
          ./experiments/FirstPersonView/tests/Test-BenchmarkCapture.ps1
          ./experiments/FirstPersonView/tests/Test-BenchmarkDataCopy.ps1
          ./experiments/FirstPersonView/tests/Test-HeldPackage.ps1
          ./experiments/FirstPersonView/tests/Test-WorldPackage.ps1
      - name: Configure isolated module
        run: cmake -S experiments/FirstPersonView -B fp-build -DCMAKE_BUILD_TYPE=Release -DFIRST_PERSON_BUILD_BENCHMARK=ON
      - name: Build prototype and contract tests
        run: cmake --build fp-build --config Release
      - name: Renderer, occlusion, fog, ABI and toggle lifecycle
        run: ctest --test-dir fp-build -C Release --output-on-failure
      - name: Offline PSX importer malformed-input and determinism checks
        run: python -B experiments/FirstPersonView/tests/test_import_psx_arms.py -v
      - name: Offline held resource conversion and malformed-input checks
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python -B experiments/FirstPersonView/tests/test_import_held_items.py -v
          python -B experiments/FirstPersonView/tests/test_calibrate_grips.py -v
          python -B experiments/FirstPersonView/tools/calibrate_grips.py --selection experiments/FirstPersonView/assets/held_items/selection.json --check
          python -B experiments/FirstPersonView/tools/calibrate_sights.py --selection experiments/FirstPersonView/assets/held_items/selection.json
          python -B experiments/FirstPersonView/tests/test_import_world_props.py -v
          python -B experiments/FirstPersonView/tests/test_verify_held_gallery.py -v
          python -B experiments/FirstPersonView/tools/import_held_items.py --selection experiments/FirstPersonView/assets/held_items/selection.json --output experiments/FirstPersonView/assets/held_items/generated --check
      - name: Native firing pixel verifier negative tests
        run: |
          python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_fire_pixels.py -v
      - name: Static-stair causal evidence verifier negative tests
        run: python -B -m unittest discover -s experiments/FirstPersonView/tests -p test_verify_static_stair_audit.py -v
      - name: Record renderer timing and work counters (no FPS threshold)
        run: cmake --build fp-build --config Release --target first_person_measure
      - name: Configure focused cache and facade sanitizers
        if: runner.os == 'Linux'
        run: cmake -S experiments/FirstPersonView -B fp-cache-sanitize -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFIRST_PERSON_SANITIZE=ON
      - name: Build focused cache and facade sanitizers
        if: runner.os == 'Linux'
        run: cmake --build fp-cache-sanitize --parallel 2 --target first_person_snapshot_cache_tests first_person_scene_signature_tests first_person_multilevel_policy_tests first_person_multilevel_cache_tests first_person_multilevel_gpu_cache_tests first_person_facade_continuity_tests first_person_viewmodel_asset_tests first_person_viewmodel_rig_tests first_person_viewmodel_gpu_tests first_person_sight_cache_tests first_person_sight_distance_tests
      - name: ASan and UBSan sparse coordinates, face masks and facade continuity
        if: runner.os == 'Linux'
        run: ctest --test-dir fp-cache-sanitize -R "^first_person_(snapshot_cache|scene_signature|multilevel_(policy|cache|gpu_cache)|facade_continuity|viewmodel_(asset|rig|gpu)|sight_(cache|distance))$" --output-on-failure
      - name: Configure sanitizer coverage
        if: runner.os == 'Linux' && needs.qualification_plan.outputs.full == 'true'
        run: cmake -S experiments/FirstPersonView -B fp-sanitize -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFIRST_PERSON_SANITIZE=ON
      - name: Build sanitizer geometry and shared-module tests
        if: runner.os == 'Linux' && needs.qualification_plan.outputs.full == 'true'
        run: cmake --build fp-sanitize --parallel 2 --target first_person_camera_motion_tests first_person_target_hud_tests first_person_optimization_tests first_person_hybrid_module_tests first_person_creature_semantics_tests first_person_creature_mesh_tests first_person_creature_appearance_tests first_person_creature_animation_tests first_person_creature_lod_tests first_person_creature_cache_tests first_person_creature_render_tests first_person_creature_module_tests first_person_gpu_contract_tests first_person_gpu_geometry_tests first_person_gpu_module_tests first_person_multilevel_policy_tests first_person_multilevel_cache_tests first_person_multilevel_render_tests first_person_multilevel_module_tests first_person_multilevel_gpu_cache_tests
      - name: ASan and UBSan camera, volume and DLL lifecycle coverage
        if: runner.os == 'Linux' && needs.qualification_plan.outputs.full == 'true'
        run: ctest --test-dir fp-sanitize -R "camera_motion|target_hud|optimization|hybrid_module|creature_|gpu_|multilevel_" --output-on-failure
      - name: Atomic source-transform negative tests
        run: python -m unittest discover -s experiments/graphics_bridge -p test_apply_graphics_bridge.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: first-person-module-${{ matrix.os }}
          path: |
            fp-build/Release/ncmm_mod.dll
            fp-build/ncmm_mod.so
            experiments/FirstPersonView/mod.json
            fp-build/first-person-benchmark.json
          retention-days: 7
  host:
    if: needs.qualification_plan.outputs.native == 'true'
    needs: [qualification_plan]
    name: Experimental MSVC Host - ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: '1040'
            source: 3f7fb352bf492ba521bd9408a0c9f6ce239e8d83
            tag: cdda-experimental-2026-10-01-1040
          - build: '1807'
            source: 074aa98bd5be3de4c35f154082db32a0e63bb0f1
            tag: cdda-experimental-2026-10-06-1807
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      FP_FULL_QUALIFICATION: ${{ needs.qualification_plan.outputs.full }}
      GH_TOKEN: ${{ github.token }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/upstream/.github/vcpkg_triplets
      BACKTRACE: '1'
      CDDA_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: ncmmrepo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ matrix.source }}
          path: upstream
          persist-credentials: false
      - name: Prepare canonical NCMM plus optional graphics bridge
        shell: powershell
        run: ./ncmmrepo/experiments/FirstPersonView/Prepare-FirstPersonHost.ps1 -SourceRoot upstream
      - uses: microsoft/setup-msbuild@v2
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: f6672d8e480ccdecddfad3fd1b838ba369ffe6cd
      - name: Integrate pinned vcpkg
        shell: powershell
        run: vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: gettext make
      - uses: actions/cache@v4
        id: sdk_cache
        with:
          path: upstream/msvc-full-features/vcpkg_installed
          key: ncmm-vcpkg-${{ runner.os }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd-${{ hashFiles('upstream/msvc-full-features/vcpkg.json', 'upstream/msvc-full-features/vcpkg-configuration.json', 'upstream/msvc-full-features/ncmm-sdl-overlay/**', 'upstream/.github/vcpkg_triplets/x64-windows-static.cmake') }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - name: Configure the canonical compiler cache wrapper
        shell: powershell
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'ncmm-fp-sccache'
          New-Item -ItemType Directory -Force $dir,(Join-Path $dir 'logs') | Out-Null
          Copy-Item -LiteralPath 'ncmmrepo/experiments/FirstPersonView/tools/compile_cached.cmd' -Destination (Join-Path $dir 'cl.bat')
          "NCMM_SCCACHE_WRAPPER_DIR=$dir" >> $env:GITHUB_ENV
          $props='upstream/msvc-full-features/Cataclysm-common.props'
          $text=[IO.File]::ReadAllText((Join-Path $PWD $props))
          # Upstream _CDDA_USE_CCACHE disables PCH creation/use. sccache
          # rejects /Fp and /Yc; leaving PCH on bypassed 292/332 requests.
          $pchProps=[IO.File]::ReadAllText((Join-Path $PWD 'upstream/msvc-full-features/Cataclysm-pch.props'))
          if(!$pchProps.Contains('Condition="$(_CDDA_USE_CCACHE)"') -or !$pchProps.Contains('<PrecompiledHeader>NotUsing</PrecompiledHeader>')){throw 'Upstream cache/PCH configuration changed.'}
          $parallel='<MultiProcessorCompilation>true</MultiProcessorCompilation>'
          $debug='<DebugInformationFormat>ProgramDatabase</DebugInformationFormat>'
          if(!$text.Contains($parallel) -or !$text.Contains($debug)){throw 'Canonical compiler-cache anchors changed.'}
          $text=$text.Replace($parallel,'<MultiProcessorCompilation>false</MultiProcessorCompilation>').Replace($debug,'<DebugInformationFormat>OldStyle</DebugInformationFormat>')
          [IO.File]::WriteAllText((Join-Path $PWD $props),$text,(New-Object Text.UTF8Encoding($false)))
      - uses: actions/cache/restore@v4
        id: engine_cache
        with:
          path: |
            upstream/cataclysm-tiles.exe
            upstream/first-person-host.sha256
            upstream/*.pdb
          key: ncmm-fp-host-${{ matrix.build }}-v4-sdk-source-${{ runner.os }}-${{ hashFiles('upstream/src/**', 'upstream/msvc-full-features/**', 'upstream/first-person-source.json', 'upstream/.github/vcpkg_triplets/**', '!upstream/msvc-full-features/vcpkg_installed/**') }}
      - name: Compile actual experimental engine (no certification/publication)
        if: steps.engine_cache.outputs.cache-hit != 'true'
        shell: powershell
        working-directory: upstream
        run: |
          & msbuild -m -p:Configuration=Release -p:Platform=x64 -p:CLToolExe=cl.bat "-p:CLToolPath=$env:NCMM_SCCACHE_WRAPPER_DIR" -p:TrackFileAccess=false -p:UseMultiToolTask=true -p:_CDDA_USE_CCACHE=true -target:Cataclysm-vcpkg-static msvc-full-features/Cataclysm-vcpkg-static.sln
          if($LASTEXITCODE -ne 0){throw 'Experimental MSVC Host build failed.'}
          if(!(Test-Path cataclysm-tiles.exe)){throw 'Experimental engine binary missing.'}
          (Get-FileHash cataclysm-tiles.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content first-person-host.sha256 -Encoding Ascii
      - name: Record effective compiler cache coverage
        if: always()
        shell: powershell
        run: |
          if(Get-Command sccache.exe -ErrorAction SilentlyContinue) {
            $raw=& sccache.exe --show-stats --stats-format=json
            if($LASTEXITCODE -eq 0) {
              $raw | Set-Content compiler-cache.json -Encoding UTF8
              $stats=($raw | ConvertFrom-Json).stats
              $cacheable=[int]$stats.requests_executed
              $requests=[int]$stats.compile_requests
              Write-Host "Cacheable requests: $cacheable / $requests; bypass reasons are retained in compiler-cache.json."
              foreach($flag in @('/Fp','/Yc')){
                $bypass=$stats.not_cached.PSObject.Properties[$flag]
                if($bypass -and [int]$bypass.Value -gt 0){throw "PCH still bypasses sccache: $flag=$($bypass.Value)"}
              }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-person-compiler-cache-${{ matrix.build }}
          path: compiler-cache.json
          retention-days: 7
      - name: Preserve complete failed compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-person-compiler-failures-${{ matrix.build }}
          path: ${{ runner.temp }}/ncmm-fp-sccache/logs/*.failed.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify compiled or cached engine identity
        shell: powershell
        working-directory: upstream
        run: |
          $expected=(Get-Content first-person-host.sha256 -Raw).Trim()
          if($expected -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash cataclysm-tiles.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw 'Experimental Host cache identity mismatch.'}
      - name: Exercise pinned SDL graphics descriptor boundaries and pixel restoration
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dependency=(Get-Content upstream/first-person-source.json -Raw | ConvertFrom-Json).windows_sdl
          if($dependency.sdl_version -ne '3.4.10' -or $dependency.private_port_version -ne 2 -or !$dependency.runtime_vendor){throw 'Pinned private SDL receipt missing.'}
          $env:NCMM_EXPECT_SDL_VENDOR=$dependency.runtime_vendor
          $build=Join-Path $PWD 'sdl-descriptor-${{ matrix.build }}'
          # The canonical MSBuild integration installs the triplet inside its
          # triplet-specific VcpkgInstalledDir; use that same library, not a search fallback.
          $sdkRoot=Join-Path $PWD 'upstream/msvc-full-features/vcpkg_installed/x64-windows-static/x64-windows-static'
          $sdk=Join-Path $sdkRoot 'share/sdl3'
          if(!(Test-Path -LiteralPath (Join-Path $sdk 'SDL3Config.cmake') -PathType Leaf)){throw 'Canonical MSBuild SDL package configuration is missing.'}
          $libraryRoot=(Resolve-Path $sdkRoot).Path.TrimEnd([char[]]@('\','/'))+[IO.Path]::DirectorySeparatorChar
          & cmake -S ncmmrepo/experiments/FirstPersonView/tests/sdl_descriptor -B $build -A x64 "-DSDL3_DIR=$sdk" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if($LASTEXITCODE -ne 0){throw 'Pinned SDL descriptor regression configure failed.'}
          & cmake --build $build --config Release --parallel 2
          if($LASTEXITCODE -ne 0){throw 'Pinned SDL descriptor regression compile failed.'}
          Push-Location (Join-Path $build 'Release')
          try {
            & ./ncmm_sdl_descriptor_repro.exe 4 *> stdout.log
            if($LASTEXITCODE -ne 0){Get-Content stdout.log;throw 'Actual SDL descriptor boundary/pixel regression failed.'}
            Get-Content stdout.log
            $library=[IO.Path]::GetFullPath((Get-Content sdl-library-path.txt -Raw).Trim())
            if(-not $library.StartsWith($libraryRoot,[StringComparison]::OrdinalIgnoreCase)){throw 'SDK test linked an unexpected SDL library.'}
            [ordered]@{sdl_dependency=$dependency;library_sha256=(Get-FileHash -LiteralPath $library -Algorithm SHA256).Hash.ToLowerInvariant();frames=4;draws=16384;pixels_checked=262144;ordinary_game_performance=$false;manual_playthrough=$false} | ConvertTo-Json -Depth 8 | Set-Content sdl-descriptor-identity.json -Encoding UTF8
          } finally {Pop-Location}
      - name: Preserve the verified private SDK before long Native gameplay
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: upstream/msvc-full-features/vcpkg_installed
          key: ncmm-vcpkg-${{ runner.os }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd-${{ hashFiles('upstream/msvc-full-features/vcpkg.json', 'upstream/msvc-full-features/vcpkg-configuration.json', 'upstream/msvc-full-features/ncmm-sdl-overlay/**', 'upstream/.github/vcpkg_triplets/x64-windows-static.cmake') }}
      - uses: actions/upload-artifact@v4
        with:
          name: first-person-sdl-descriptors-${{ matrix.build }}
          path: |
            sdl-descriptor-${{ matrix.build }}/Release/stdout.log
            sdl-descriptor-${{ matrix.build }}/Release/descriptor-boundary-last.bmp
            sdl-descriptor-${{ matrix.build }}/Release/sdl-descriptor-identity.json
            sdl-descriptor-${{ matrix.build }}/CMakeCache.txt
          retention-days: 7
      - uses: actions/cache/save@v4
        if: steps.engine_cache.outputs.cache-hit != 'true'
        with:
          path: |
            upstream/cataclysm-tiles.exe
            upstream/first-person-host.sha256
            upstream/*.pdb
          key: ${{ steps.engine_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: first-person-experimental-host-${{ matrix.build }}
          path: |
            upstream/cataclysm-tiles.exe
            upstream/first-person-source.json
            upstream/*.pdb
            upstream/LICENSE.txt
            ncmmrepo/THIRD_PARTY_NOTICES.txt
          retention-days: 7
      - name: Download SHA256-verified official Windows ${{ matrix.build }} graphics and sounds packages
        id: game
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tag='${{ matrix.tag }}'
          $release=(& gh api "repos/CleverRaven/Cataclysm-DDA/releases/tags/$tag") | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Official release lookup failed.'}
          $download=Join-Path $env:RUNNER_TEMP 'fp-download'
          New-Item -ItemType Directory -Force $download | Out-Null
          $dateBuild=$tag.Substring('cdda-experimental-'.Length)
          foreach($variant in @(@{name='graphics';output='root'},@{name='graphics-and-sounds';output='sound_root'})) {
            $name="cdda-windows-with-$($variant.name)-x64-$dateBuild.zip"
            $matchingAssets=@($release.assets | Where-Object {$_.name -eq $name})
            if($matchingAssets.Count -ne 1 -or [string]$matchingAssets[0].digest -notmatch '^sha256:[0-9a-f]{64}$'){throw "Missing official archive identity: $name"}
            $asset=$matchingAssets[0]
            $extract=Join-Path $env:RUNNER_TEMP ("fp-game-"+$variant.name)
            New-Item -ItemType Directory -Force $extract | Out-Null
            & gh release download $tag -R CleverRaven/Cataclysm-DDA -p $name -D $download
            if($LASTEXITCODE -ne 0){throw "Official game download failed: $name"}
            $zip=Join-Path $download $name
            if(('sha256:'+(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()) -ne [string]$asset.digest){throw "Official archive digest mismatch: $name"}
            & tar.exe -xf $zip -C $extract
            if($LASTEXITCODE -ne 0){throw "Official game extraction failed: $name"}
            $exes=@(Get-ChildItem $extract -Filter cataclysm-tiles.exe -Recurse -File)
            if($exes.Count -ne 1){throw "Expected one official game executable: $name"}
            Write-Host "Verified $name; executable SHA256: $((Get-FileHash $exes[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            "$($variant.output)=$($exes[0].Directory.FullName)" >> $env:GITHUB_OUTPUT
          }
      - name: Acquire SHA256-verified 0.13 main baseline Host and DLL
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          New-Item -ItemType Directory -Force installer-result | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pins=@{
