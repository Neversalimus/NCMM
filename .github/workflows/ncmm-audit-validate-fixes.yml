name: Engineering audit - Windows regression qualification
on:
  push:
    branches: ['fix/engineering-audit-20261009']
    paths: ['.github/workflows/ncmm-audit-validate-fixes.yml']
permissions:
  contents: write
concurrency:
  group: ncmm-audit-qualification
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engineering-audit-20261009
          fetch-depth: 1
      - name: Make native fixture encoding explicit and require guarded Survivor Core access
        shell: python
        run: |
          from pathlib import Path
          p = Path('ci/Generate-AuditNativeTests.py')
          s = p.read_text(encoding='utf-8')
          assert s.count('.read_text()') == 2
          s = s.replace('.read_text()', ".read_text(encoding='utf-8-sig')")
          lines = s.splitlines(keepends=True)
          writes = 0
          for i,line in enumerate(lines):
              if '.write_text(' in line:
                  assert line.rstrip().endswith(')')
                  lines[i] = line.rstrip()[:-1] + ", encoding='utf-8', newline='\\n')\n"
                  writes += 1
          assert writes == 3
          p.write_text(''.join(lines),encoding='utf-8',newline='\n')
          compile(p.read_text(encoding='utf-8'),str(p),'exec')
          p = Path('tests/CMakeLists.txt')
          s = p.read_text(encoding='utf-8')
          assert s.count('PRIVATE /EHsc)') == 1
          p.write_text(s.replace('PRIVATE /EHsc)', 'PRIVATE /EHsc /utf-8)'),encoding='utf-8',newline='\n')
          p = Path('ci/Test-SurvivorPayloadContracts.ps1')
          s = p.read_text(encoding='utf-8-sig')
          old = "    'api->query_interface( NCMM_HOST_API_V2_CORE_ID, 2u, 1u )',"
          new = "    'const auto core = ncmm::sdk::require_core( api, required_caps,',\n    'NCMM_SDK_CORE_FIELD_END( virtual_item_uid ), 1u );',\n    'host2 = core ? core.core : nullptr;',"
          assert s.count(old) == 1
          p.write_text(s.replace(old,new),encoding='utf-8-sig',newline='\n')
      - name: Synchronize and commit source-only repairs
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path -Check
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path -Check
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'Diff check failed.'}
          git config user.name 'NCMM Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add ci/Generate-AuditNativeTests.py tests/CMakeLists.txt ci/Test-SurvivorPayloadContracts.ps1 payload/SURVIVOR_0911_0915_v8.7.6.8.ps1 compat/package.integrity.json
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0) {
            git commit -m 'Use explicit UTF-8 for native test generation and enforce guarded Core contract'
            if($LASTEXITCODE -ne 0){throw 'Source commit failed.'}
            git push origin HEAD:refs/heads/fix/engineering-audit-20261009
            if($LASTEXITCODE -ne 0){throw 'Feature branch source push failed.'}
          }
      - uses: microsoft/setup-msbuild@v2
      - name: Validate source, payload and PowerShell contracts
        if: steps.source.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          Start-Transcript -Path evidence/source-validation.log
          try {
            ./ci/Test-CanonicalPayloadSync.ps1 -RepositoryRoot $PWD.Path
            ./ci/Test-Infrastructure083.ps1 -PackageRoot $PWD.Path
          } finally { Stop-Transcript }
      - name: Build production runtime and execute all failure and module harnesses
        if: always() && steps.source.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          Start-Transcript -Path evidence/windows-validation.log
          try { ./ci/Build-Runtime.ps1 -RepositoryRoot $PWD.Path -OutputRoot (Join-Path $PWD 'dist/runtime') }
          finally { Stop-Transcript }
      - name: Save tested source identity
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/tested-source.txt
          git status --short | Set-Content evidence/worktree-status.txt
          git archive HEAD -o evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NCMM-engineering-regression-evidence
          path: evidence/**
          retention-days: 14
          if-no-files-found: error
