name: Engineering audit - Windows regression qualification
on:
  push:
    branches: ['fix/engineering-audit-20261009']
    paths: ['.github/workflows/ncmm-audit-validate-fixes.yml']
permissions:
  contents: read
concurrency:
  group: ncmm-audit-qualification
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Validate exact source, payload and PowerShell contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./ci/Sync-CanonicalPayload.ps1 -RepositoryRoot $PWD.Path -Check
          ./ci/Regenerate-PackageIntegrity.ps1 -PackageRoot $PWD.Path -Check
          ./ci/Test-CanonicalPayloadSync.ps1 -RepositoryRoot $PWD.Path
          ./ci/Test-Infrastructure083.ps1 -PackageRoot $PWD.Path
      - name: Build production runtime and run all failure and module harnesses
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $args=@('-NoProfile','-ExecutionPolicy','Bypass','-File',(Join-Path $PWD 'ci/Build-Runtime.ps1'),'-RepositoryRoot',$PWD.Path,'-OutputRoot',(Join-Path $PWD 'dist/runtime'))
          $p=Start-Process powershell.exe -ArgumentList $args -Wait -PassThru -NoNewWindow -RedirectStandardOutput evidence/windows-stdout.log -RedirectStandardError evidence/windows-stderr.log
          Get-Content evidence/windows-stdout.log
          if($p.ExitCode -ne 0){Get-Content evidence/windows-stderr.log;throw "Runtime qualification exit code: $($p.ExitCode)"}
      - name: Save tested source identity without altering it
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/tested-source.txt
          git status --short | Set-Content evidence/worktree-status.txt
          git archive HEAD -o evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NCMM-engineering-regression-evidence
          path: evidence/**
          retention-days: 14
          if-no-files-found: error
