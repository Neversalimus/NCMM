name: Ballistic Host Smoke

on:
  push:
    branches:
      - feature/ballistic-hit-chance
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: ballistic-host-smoke
  cancel-in-progress: true

jobs:
  host-smoke:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout NCMM branch
        uses: actions/checkout@v4
        with:
          path: ncmmrepo

      - name: Checkout certified CDDA seed
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: cdda-experimental-2026-09-23-0546
          fetch-depth: 1
          path: upstream

      - name: Contract preflight and patch
        shell: powershell
        run: |
          ./ncmmrepo/host_patch/Apply-NCMMHostPatch.ps1 -SourceRoot ./upstream

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'f6672d8e480ccdecddfad3fd1b838ba369ffe6cd'

      - name: Integrate vcpkg
        shell: powershell
        run: |
          vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'

      - name: Setup MSYS2 helper tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: upstream/msvc-full-features/vcpkg_installed
          key: ncmm-vcpkg-${{ runner.os }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd-${{ hashFiles('upstream/msvc-full-features/vcpkg.json', 'upstream/.github/vcpkg_triplets/x64-windows-static.cmake') }}

      - name: Setup sccache compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: 'v0.16.0'

      - name: Configure MSVC sccache wrapper
        shell: powershell
        run: |
          $wrapperDir = Join-Path $env:RUNNER_TEMP 'ncmm-sccache-wrapper'
          New-Item -ItemType Directory -Force -Path $wrapperDir | Out-Null
          @'
          @echo off
          setlocal
          sccache.exe cl.exe %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content -Encoding Ascii (Join-Path $wrapperDir 'cl.bat')
          "NCMM_SCCACHE_WRAPPER_DIR=$wrapperDir" >> $env:GITHUB_ENV
          sccache --zero-stats

      - name: Build patched host
        shell: powershell
        run: |
          ./ncmmrepo/ci/Build-HostPackage.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/ncmmrepo" `
            -UpstreamRoot "$env:GITHUB_WORKSPACE/upstream" `
            -UpstreamTag 'cdda-experimental-2026-09-23-0546' `
            -OutputRoot "$env:GITHUB_WORKSPACE/result/package"

      - name: Upload 0546 test host
        uses: actions/upload-artifact@v4
        with:
          name: NCMM_BallisticHitChance_0546_Host_v0.8.2
          path: result/*.zip
          if-no-files-found: error

      - name: Report sccache
        if: always()
        shell: powershell
        run: sccache --show-stats
